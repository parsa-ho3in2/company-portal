:root{

  --primary:#6aaaff;--primary-2:#b9d7ff;--primary-soft:#142b4d;--focus:#83b3ff;--accent:#6aaaff;--accent-2:#b9d7ff;--accent-soft:#142b4d;--glow:rgba(106,170,255,.22);--accent-good:#c7ff55;
  --sidebar:#060d19;--sidebar-2:#102543;
}
:root[data-theme="dark"][data-palette="violet"]{
  --primary:#9a8cff;--primary-2:#d5ceff;--primary-soft:#211d42;--focus:#b2a6ff;--accent:#9a8cff;--accent-2:#d5ceff;--accent-soft:#211d42;--glow:rgba(154,140,255,.24);--accent-good:#6ff0df;
  --sidebar:#0f0b1e;--sidebar-2:#261f4b;
}
:root[data-theme="dark"][data-palette="emerald"]{
  --primary:#55d7bb;--primary-2:#b9fff0;--primary-soft:#12362f;--focus:#69e4ca;--accent:#55d7bb;--accent-2:#b9fff0;--accent-soft:#12362f;--glow:rgba(85,215,187,.22);--accent-good:#c6ff78;
  --sidebar:#061411;--sidebar-2:#0e352f;
}
:root[data-theme="dark"][data-palette="sunset"]{
  --primary:#ff9b72;--primary-2:#ffd0be;--primary-soft:#3d241b;--focus:#ffb093;--accent:#ff9b72;--accent-2:#ffd0be;--accent-soft:#3d241b;--glow:rgba(255,155,114,.24);--accent-good:#ffe07a;
  --sidebar:#1d0e09;--sidebar-2:#4b2418;
}

/* Use the active palette everywhere a primary visual appears. */
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent-2));box-shadow:0 8px 20px var(--glow)}
.btn-primary:hover{box-shadow:0 11px 28px var(--glow)}
.btn-soft{background:var(--primary-soft);color:var(--accent-2)}
.stat-icon,.qicon,.timeline-dot{background:var(--accent-soft);color:var(--accent)}
.nav-btn.active{background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 88%,#000 12%),color-mix(in srgb,var(--accent-2) 86%,#000 14%));box-shadow:0 10px 24px var(--glow)}
.nav-btn.active:before{background:var(--accent-good)}
.progress>span{background:linear-gradient(90deg,var(--accent-good),var(--primary))}
.profile-cover{background:radial-gradient(circle at 22% 28%,rgba(255,255,255,.18),transparent 20%),linear-gradient(135deg,var(--accent-2),var(--primary) 62%,var(--accent-good));}
.hero{background:radial-gradient(circle at 92% 10%,var(--glow),transparent 28%),linear-gradient(135deg,var(--surface),var(--accent-soft))}
.quick-card:hover{border-color:color-mix(in srgb,var(--primary) 36%,var(--line));box-shadow:0 14px 34px var(--glow)}
.palette-choice.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow),0 12px 26px var(--glow)}
.control:focus{border-color:var(--focus);box-shadow:0 0 0 4px var(--glow)}

/* More polished enterprise feel */
.main{scrollbar-gutter:stable}
.topbar{position:sticky;top:0;z-index:40;padding:8px 0 11px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px)}
.card{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.stat:hover,.panel:hover{transform:translateY(-2px);box-shadow:0 18px 40px var(--glow)}
.hero{position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;left:-70px;top:-105px;background:var(--glow);filter:blur(10px);pointer-events:none}
.hero>*{position:relative;z-index:1}
.panel-head h3{letter-spacing:-.12px}
.palette-choice{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.palette-choice:hover{transform:translateY(-2px)}

/* Login OTP is always visibly ready on first render. */
.otp-code{letter-spacing:.28em;font-variant-numeric:tabular-nums;min-width:150px;text-align:center}
.otp-box{position:relative}
.otp-box:focus-within{transform:translateY(-1px)}
.login-card{animation:loginCardIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes loginCardIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

/* Staggered page entrance */
@media (prefers-reduced-motion:no-preference){
  .content.page-enter>*{animation:pageItemIn .38s cubic-bezier(.2,.75,.2,1) both}
  .content.page-enter>*:nth-child(2){animation-delay:.035s}
  .content.page-enter>*:nth-child(3){animation-delay:.07s}
  .content.page-enter>*:nth-child(4){animation-delay:.105s}
}
@keyframes pageItemIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

html[data-motion="reduced"] *,html[data-motion="reduced"] *:before,html[data-motion="reduced"] *:after{animation:none!important;transition:none!important}

@media(max-width:760px){
  .topbar{padding-top:4px;background:color-mix(in srgb,var(--bg) 92%,transparent)}
  .hero{padding:16px}
  .stat:hover,.panel:hover{transform:none}
}
@media(max-width:560px){
  .palette-grid{grid-template-columns:1fr}
  .palette-choice{display:grid;grid-template-columns:62px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center}
  .palette-choice .palette-swatch{grid-row:1 / span 2;margin:0;height:42px}
}

<style id="final-ui-polish">
/* Final daily polish: crisp hover/ripple and smoother focus states without adding visual noise. */
@media (prefers-reduced-motion:no-preference){
  .btn,.icon-btn,.nav-btn,.quick-card,.request-shortcut,.profile-trigger,.pm-item,.search-result,.sm{position:relative;overflow:hidden}
  .btn:after,.icon-btn:after,.quick-card:after,.request-shortcut:after,.profile-trigger:after,.sm:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(255,255,255,.22),transparent 34%);opacity:0;transform:scale(.7);transition:opacity .18s ease,transform .28s ease;pointer-events:none}
  .btn:active:after,.icon-btn:active:after,.quick-card:active:after,.request-shortcut:active:after,.profile-trigger:active:after,.sm:active:after{opacity:1;transform:scale(1)}
}
.control:focus{transform:translateY(-.5px)}
</style>
<script id="final-ui-polish-script">
(function(){
  document.addEventListener('pointerdown',function(e){
    const el=e.target.closest('.btn,.icon-btn,.quick-card,.request-shortcut,.profile-trigger,.sm');
    if(!el)return;
    const r=el.getBoundingClientRect();
    el.style.setProperty('--rx',((e.clientX-r.left)/r.width*100)+'%');
    el.style.setProperty('--ry',((e.clientY-r.top)/r.height*100)+'%');
  },{passive:true});
})();
</script>
</head>

<script>
(function(){
  function applyMobileTableLabels(){
    document.querySelectorAll('.table-wrap table').forEach(function(table){
      var headers = Array.from(table.querySelectorAll('thead th')).map(function(th){
        return th.textContent.trim();
      });
      table.querySelectorAll('tbody tr').forEach(function(row){
        Array.from(row.children).forEach(function(cell, i){
          if(!cell.hasAttribute('data-label')){
            cell.setAttribute('data-label', headers[i] || 'اطلاعات');
          }
        });
      });
    });
  }

  window.addEventListener('load', applyMobileTableLabels);

  var root = document.getElementById('app');
  if(root){
    new MutationObserver(function(){
      applyMobileTableLabels();
    }).observe(root, {childList:true, subtree:true});
  }
})();
</script>

  window.filterCommands=renderCommands;

<script id="v5-final-fixes">
(function(){
  const nativeTheme=theme;
  window.__v5ApplyPrefs=function(){
    try{
      const root=document.documentElement;
      root.dataset.theme=localStorage.getItem('companyTheme')||'light';
      root.dataset.palette=localStorage.getItem('companyPalette')||'ocean';
      root.dataset.font=localStorage.getItem('companyFont')||'vazir';
      root.dataset.density=localStorage.getItem('companyDensity')||'comfortable';
      root.dataset.motion=localStorage.getItem('companyReduceMotion','0')==='1'?'reduced':'full';
      const meta=document.querySelector('meta[name="theme-color"]');
      if(meta){
        const palette=root.dataset.palette, dark=root.dataset.theme==='dark';
        const map={ocean:['#1977ff','#6aaaff'],violet:['#7657ff','#9a8cff'],emerald:['#0f9b7a','#55d7bb'],sunset:['#ff7a45','#ff9b72']};
        meta.setAttribute('content',(map[palette]||map.ocean)[dark?1:0]);
      }
    }catch(e){}
  };
  window.theme=function(){
    const t=nativeTheme();
    __v5ApplyPrefs();
    return t;
  };
  const baseLoginView=loginView;
  window.loginView=function(){
    const html=baseLoginView();
    setTimeout(function(){
      if(document.getElementById('otpCode')){
        if(!loginOtp || Date.now()>otpExpires){refreshOtp();}
        else {document.getElementById('otpCode').textContent=loginOtp;updateOtpTimer(document.getElementById('otpMeta'));}
      }
    },0);
    return html;
  };
  window.setPalette=function(v){
    const allowed=['ocean','violet','emerald','sunset'];
    if(!allowed.includes(v))v='ocean';
    localStorage.setItem('companyPalette',v);__v5ApplyPrefs();render();setTimeout(()=>toast('تم رنگی اعمال شد'),40);
  };
  window.setFont=function(v){
    const allowed=['vazir','noto','tajawal'];
    if(!allowed.includes(v))v='vazir';
    localStorage.setItem('companyFont',v);__v5ApplyPrefs();document.body.offsetHeight;render();setTimeout(()=>toast('فونت رابط اعمال شد'),40);
  };
  window.setDensity=function(v){
    localStorage.setItem('companyDensity',v==='compact'?'compact':'comfortable');__v5ApplyPrefs();render();setTimeout(()=>toast('تراکم رابط اعمال شد'),40);
  };
  window.toggleMotionPref=function(btn){
    const reduced=localStorage.getItem('companyReduceMotion')==='1';
    localStorage.setItem('companyReduceMotion',reduced?'0':'1');__v5ApplyPrefs();
    if(btn)btn.textContent=reduced?'انیمیشن استاندارد فعال است':'حرکت کم‌حجم فعال است';
    toast(reduced?'انیمیشن استاندارد فعال شد':'حرکت‌های اضافی کم شد');
  };
  // Prevent palette/font selections from being lost on repeated renders.
  const oldRender=render;
  window.render=function(){__v5ApplyPrefs();oldRender();requestAnimationFrame(__v5ApplyPrefs)};
  __v5ApplyPrefs();
  // Re-run once so the first login render uses the initialized OTP and preferences.
  requestAnimationFrame(()=>window.render());
})();
</script>

    if(!rows.length)return '<div class="empty-state"><div class="empty-icon">'+svg.bell+'</div><strong>اعلان جدیدی نیست</strong><p>وقتی رویداد تازه‌ای برای حساب شما ایجاد شود، اینجا نمایش داده خواهد شد.</p></div>';
    return '<div class="notif-list">'+rows.map(x=>'<div class="notif-item '+(x.unread?'unread':'')+'" onclick="markNoticeRead('+x.i+')"><div class="nicon">'+x.n[0]+'</div><div><strong>'+esc(x.n[1])+'</strong><span>'+esc(x.n[2])+'</span></div><span class="unread-dot" style="opacity:'+(x.unread?1:0)+'"></span></div>').join('')+'</div>';
  }
  window.renderNotificationsPage=function(mode){
    const el=document.getElementById('notificationsPageList');if(!el)return;el.innerHTML='<div class="skeleton" style="height:150px;border-radius:14px"></div>';setTimeout(()=>{el.innerHTML=renderNotificationRows(mode,notificationState(),db.notices||[])},120)
  };

  window.openGlobalSearch=function(initial){
    let el=document.getElementById('globalSearchBackdrop');
    if(!el){
      el=document.createElement('div');el.id='globalSearchBackdrop';el.className='global-search-backdrop';el.innerHTML='<div class="global-search-box" role="dialog" aria-modal="true" aria-label="جستجوی سراسری"><div class="global-search-head"><span style="color:var(--accent)">'+svg.search+'</span><input id="globalSearchInput" class="control" placeholder="نام، شناسه، فرآیند یا سند را جستجو کنید..." autocomplete="off" oninput="runGlobalSearch()"><button class="icon-btn" onclick="closeGlobalSearch()" aria-label="بستن">'+svg.close+'</button></div><div id="globalSearchMeta" class="global-search-meta"></div><div id="globalSearchResults" class="global-search-results"></div><div class="global-search-foot"><span>برای جستجوی سریع‌تر چند حرف کلیدی کافی است.</span><span><span class="shortcut-key">Esc</span> بستن</span></div></div>';
      document.body.appendChild(el);el.addEventListener('click',e=>{if(e.target===el)closeGlobalSearch()});
    }
    el.classList.add('show');const input=document.getElementById('globalSearchInput');input.value=initial||'';runGlobalSearch();setTimeout(()=>input.focus(),20);
  };
  window.closeGlobalSearch=function(){document.getElementById('globalSearchBackdrop')?.classList.remove('show')};
  window.runGlobalSearch=function(){
    const q=norm(document.getElementById('globalSearchInput')?.value||'');
    const rows=[];
    const pages=[['dashboard','داشبورد','نمای کلی سامانه'],['inbox','کارتابل من','موارد نیازمند اقدام'],['requests','درخواست‌ها','ثبت و پیگیری درخواست‌ها'],['attendance','تردد و کارکرد','حضور و ساعت‌زنی'],['processes','فرآیندها','گردش کارهای سازمانی'],['reports','گزارشات','شاخص‌ها و آمار'],['docs','اسناد و فرم‌ها','فرم‌ها و مستندات'],['notifications','اعلان‌ها','اطلاعیه و یادآوری'],['profile','حساب من','اطلاعات پرسنلی'],['settings','تنظیمات','تم، فونت و تجربه کاربری']];
    pages.forEach(x=>{if(!q||norm(x[1]+' '+x[2]).includes(q))rows.push({kind:'page',label:x[1],sub:x[2],icon:svg.arrow,type:'صفحه',action:'nav("'+x[0]+'")'});});
    (window.__processCatalog||[]).forEach((p,i)=>{const text=p.name+' '+p.owner+' '+p.steps.map(s=>s[0]).join(' ');if(!q||norm(text).includes(q))rows.push({kind:'process',label:p.name,sub:'مالک: '+p.owner,type:'فرآیند',icon:svg.process,action:'closeGlobalSearch();openProcess('+i+')'});});
    (db.req||[]).forEach(r=>{const u=db.users.find(x=>x.id===r.uid);const text=r.id+' '+r.title+' '+r.type+' '+(u?.name||'');if(!q||norm(text).includes(q))rows.push({kind:'request',label:r.id+' — '+r.title,sub:(u?.name||'')+' · '+r.status,type:'درخواست',icon:svg.req,action:'closeGlobalSearch();details("'+r.id+'")'});});
    (db.users||[]).forEach(u=>{const text=u.name+' '+u.role+' '+u.unit+' '+u.employeeId;if(!q||norm(text).includes(q))rows.push({kind:'user',label:u.name,sub:u.role+' · '+u.unit,type:'پرسنل',icon:svg.user,action:'closeGlobalSearch();nav("people")'});});
    ['فرم درخواست مرخصی','فرم درخواست دورکاری','فرم ماموریت اداری','فرم پاسخ استعلام','فرم قرارداد مالی','فرم تحصیل دارایی','فرم ابطال دارایی','فرم خروج کالا'].forEach(d=>{if(!q||norm(d).includes(q))rows.push({kind:'doc',label:d,sub:'مشاهده، چاپ یا دانلود',type:'سند/فرم',icon:svg.doc,action:'closeGlobalSearch();nav("docs")'});});
    const meta=document.getElementById('globalSearchMeta'),list=document.getElementById('globalSearchResults');
    meta.textContent=q?(rows.length+' نتیجه برای «'+q+'»'):'پیشنهادهای سریع و جستجوی سراسری';
    if(!rows.length){list.innerHTML='<div class="empty-state"><div class="empty-icon">'+svg.search+'</div><strong>نتیجه‌ای پیدا نشد</strong><p>عبارت جستجو را کوتاه‌تر کنید یا بخشی از نام، شناسه یا عنوان را وارد کنید.</p></div>';return}
    const groups={page:'دسترسی‌ها',process:'فرآیندها',request:'درخواست‌ها',user:'پرسنل',doc:'اسناد و فرم‌ها'};let html='';let currentGroup='';
    rows.slice(0,30).forEach(r=>{if(groups[r.kind]!==currentGroup){currentGroup=groups[r.kind];html+='<div class="search-group-title">'+currentGroup+'</div>'}html+='<button class="search-result" onclick="'+r.action+'"><span class="sr-icon">'+r.icon+'</span><span><strong>'+esc(r.label)+'</strong><small>'+esc(r.sub)+'</small></span><span class="sr-type">'+r.type+'</span></button>'});
    list.innerHTML=html;
  };

  window.dashboard=function(){return oldDashboard()+window.systemStatus();};
  window.profile=function(){return oldProfile()+window.activityHistory();};
  window.content=function(){
    if(page==='dashboard')return window.dashboard();
    if(page==='profile')return window.profile();
    if(page==='notifications')return window.notifications();
    return oldContent();
  };

  // Search all major surfaces from the top search and add a real activity trail.
  const oldNav=window.nav||nav;
  window.nav=function(p){
    const labels={dashboard:'داشبورد',inbox:'کارتابل',requests:'درخواست‌ها',attendance:'تردد و کارکرد',approvals:'تأییدها',people:'پرسنل',processes:'فرآیندها',reports:'گزارشات',docs:'اسناد و فرم‌ها',notifications:'اعلان‌ها',profile:'حساب من',settings:'تنظیمات'};
    if(session&&page!==p) logActivity('مشاهده بخش سامانه','ورود به '+(labels[p]||p),'◉');
    oldNav(p);
  };

  const oldLogin=window.login||login;
  window.login=function(){
    const before=session?.id;
    oldLogin();
    if(!before&&session?.id){logActivity('ورود موفق به سامانه','نشست کاربری جدید ایجاد شد','✓');render();}
  };
  const oldLogout=window.logout||logout;
  window.logout=function(){
    if(session&&current())logActivity('خروج از سامانه','نشست کاربری پایان یافت','→');
    oldLogout();
  };
  const oldSubmit=window.submitRequest||submitRequest;
  window.submitRequest=function(e){oldSubmit(e)};
  const oldDecide=window.decide||decide;
  window.decide=function(id,status){oldDecide(id,status);logActivity('تغییر وضعیت درخواست',id+' · '+status,status==='تأیید شده'?'✓':'!');render();};

  document.addEventListener('click',function(e){
    const panel=document.getElementById('notifPanel'), wrap=e.target.closest('.notif-wrap');
    if(panel&&panel.classList.contains('show')&&!wrap){panel.classList.remove('show')}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeGlobalSearch();document.getElementById('notifPanel')?.classList.remove('show')}
  });

  const originalRender=window.render;
  window.render=function(){
    window.applyPrefs?.();
    document.documentElement.dataset.motion=(localStorage.getItem('companyReduceMotion')||'0')==='1'?'reduced':'full';
    document.getElementById('app').innerHTML=session&&current()?window.shell():loginView();
    bindOutside();
    requestAnimationFrame(()=>{window.applyPrefs?.();document.querySelector('.content')?.classList.add('page-enter');});
  };
  window.render();
})();
</script>


<style id="v7-final-polish">
/* Clearer Persian typography */
html,body,button,input,select,textarea{font-synthesis:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-weight:500}
.nav-btn,.btn,.field label,.panel-head h3,.title h1,.hero h2,.stat strong,.card h3,.process-card h4,.detail strong,.command-item span,.search-result strong{font-weight:700}
th,.badge,.sm,.palette-choice strong,.font-choice strong,.profile-title h2{font-weight:700}
.profile-title h2{letter-spacing:-.25px}
.muted,.detail small,.notice span,.timeline-item p,.activity-row p{font-weight:500}
.font-sample{font-weight:700!important;font-size:14px!important;letter-spacing:-.15px}
.font-choice{min-height:94px!important}
.control{font-weight:500}
::placeholder{opacity:.72}

/* Profile editing / avatar */
.profile-actions{align-items:center;flex-wrap:wrap}
.profile-actions .btn{min-height:40px}
.avatar-photo{background-position:center;background-size:cover;background-repeat:no-repeat;color:transparent!important;background-color:var(--surface-3)!important}
.profile-photo-editor{display:grid;grid-template-columns:90px 1fr;gap:15px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.profile-photo-preview{width:78px;height:78px;border-radius:22px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--accent-soft),var(--surface));color:var(--accent);font-size:27px;font-weight:800;border:1px solid var(--line)}
.profile-photo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.profile-photo-actions{display:flex;gap:8px;flex-wrap:wrap}
.profile-edit-note{font-size:8px;color:var(--muted);line-height:1.9;margin-top:7px}

/* Request catalog */
.request-catalog{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.request-shortcut{border:1px solid var(--line);background:linear-gradient(145deg,var(--surface),var(--surface-2));border-radius:14px;padding:12px;text-align:right;cursor:pointer;transition:.18s ease;position:relative;overflow:hidden}
.request-shortcut:after{content:"";position:absolute;width:90px;height:90px;left:-35px;bottom:-45px;border-radius:50%;background:var(--glow);pointer-events:none}
.request-shortcut:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:0 12px 28px var(--glow)}
.request-shortcut .rs-icon{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:8px}
.request-shortcut strong{display:block;font-size:10px;font-weight:700}
.request-shortcut span{display:block;margin-top:3px;font-size:8px;color:var(--muted);line-height:1.7}
.request-form-note{margin-top:6px;font-size:8px;color:var(--muted)}
@media(max-width:900px){.request-catalog{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.request-catalog{grid-template-columns:1fr}.profile-photo-editor{grid-template-columns:1fr;text-align:center}.profile-photo-actions{justify-content:center}}
</style>

<script id="v7-final-patch">
(function(){

  function safePhoto(u){
    return (u && typeof u.avatarImage==='string' && u.avatarImage.indexOf('data:image/')===0) ? u.avatarImage : '';
  }
  function avatarMarkup(u, tag){
    const t=tag||'div', photo=safePhoto(u);

  }

  };

  window.suggestRequestTitle=function(){

  };
  function quickRequestCard(x,icon){return '<button class="request-shortcut" onclick="openRequest(\''+x[0].replace(/'/g,"\\'")+ '\')"><span class="rs-icon">'+icon+'</span><strong>'+esc(x[0])+'</strong><span>'+esc(x[1])+'</span></button>'}

  window.requests=function(){
    const mine=manager()?db.req:db.req.filter(r=>r.uid===current().id);
    const quick=requestCatalog.slice(0,8).map((x,i)=>quickRequestCard(x,[svg.req,svg.clock||'◴',svg.people,svg.chart,svg.settings,svg.doc,svg.shield,svg.process][i]||svg.req)).join('');
    const opts=requestCatalog.map(x=>'<option>'+esc(x[0])+'</option>').join('');
    const rows=mine.length?mine.map(r=>'<tr><td>'+esc(r.id)+'</td><td>'+esc(r.type)+'</td><td>'+esc(r.title)+'</td><td>'+esc(db.users.find(u=>u.id===r.uid)?.name||'')+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.stage)+'</td><td>'+badge(r.status)+'</td><td><button class="sm primary" onclick="details(\''+esc(r.id).replace(/'/g,"\\'")+'\')">'+svg.eye+' جزئیات</button></td></tr>').join(''):'<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">'+svg.req+'</div><strong>هنوز درخواستی ثبت نشده</strong><p>یکی از درخواست‌های پرکاربرد را انتخاب کنید و اولین درخواست خود را ثبت کنید.</p></div></td></tr>';
    return '<section class="card panel"><div class="panel-head"><div><h3>درخواست‌ها</h3><div class="muted" style="font-size:8px;margin-top:3px">فرآیندهای پرکاربرد و سوابق ثبت‌شده شما</div></div><button class="btn btn-primary" onclick="openRequest()">'+svg.plus+' ثبت درخواست جدید</button></div><div class="request-catalog">'+quick+'</div><div class="filters"><select class="control"><option>همه انواع</option>'+opts+'</select><select class="control"><option>همه وضعیت‌ها</option><option>در انتظار تأیید</option><option>تأیید شده</option><option>در حال بررسی</option><option>رد شده</option></select><input class="control wide" placeholder="جستجوی عنوان یا شناسه..." aria-label="جستجوی درخواست‌ها"></div><div class="table-wrap"><table><thead><tr><th>شناسه</th><th>نوع</th><th>عنوان</th><th>ثبت‌کننده</th><th>تاریخ</th><th>مرحله</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
  };

  window.profile=function(){
    const u=current();if(!u)return __v7OldProfile?__v7OldProfile():'';
    return '<section class="card" style="overflow:hidden"><div class="profile-cover"></div><div class="profile-main"><div class="profile-id">'+avatarMarkup(u,'div')+'<div class="profile-title"><h2>'+esc(u.name)+'</h2><p>'+esc(u.role)+' • '+esc(u.unit)+'</p></div><div class="profile-actions"><button class="btn btn-secondary" onclick="openProfileEditor()">'+svg.settings+' ویرایش اطلاعات</button><button class="btn btn-soft" onclick="openProfileSettings()">'+svg.user+' تنظیم پروفایل</button><button class="btn btn-soft" onclick="toggleTheme()">'+(theme()==='dark'?svg.sun:svg.moon)+' '+(theme()==='dark'?'حالت روشن':'حالت تیره')+'</button></div></div><div class="detail-grid"><div class="detail"><small>شماره پرسنلی</small><strong>'+esc(u.employeeId)+'</strong></div><div class="detail"><small>سمت سازمانی</small><strong>'+esc(u.role)+'</strong></div><div class="detail"><small>واحد سازمانی</small><strong>'+esc(u.unit)+'</strong></div><div class="detail"><small>مدیر مستقیم</small><strong>'+esc(u.manager)+'</strong></div><div class="detail"><small>شماره تماس</small><strong>'+esc(u.phone)+'</strong></div><div class="detail"><small>ایمیل سازمانی</small><strong>'+esc(u.email)+'</strong></div><div class="detail"><small>محل خدمت</small><strong>'+esc(u.location)+'</strong></div><div class="detail"><small>تاریخ استخدام</small><strong>'+esc(u.join)+'</strong></div><div class="detail"><small>آخرین ورود</small><strong>'+esc(u.lastLogin||'—')+'</strong></div><div class="detail"><small>وضعیت حساب</small><strong>'+badge('فعال')+'</strong></div><div class="detail"><small>سطح دسترسی</small><strong>'+esc(manager()?'مدیریتی':'کاربری')+'</strong></div><div class="detail"><small>امنیت حساب</small><strong style="color:var(--success)">احراز هویت دومرحله‌ای فعال</strong></div></div></div></section><div class="grid2">'+window.activityHistory()+'<section class="card panel"><div class="panel-head"><h3>خلاصه عملکرد</h3></div><div class="kpis"><div class="kpi"><small>مرخصی باقی‌مانده</small><strong>۱۸</strong><div class="progress"><span style="width:72%"></span></div></div><div class="kpi"><small>درخواست‌های باز</small><strong>'+db.req.filter(r=>r.uid===u.id&&r.status==='در انتظار تأیید').length+'</strong><div class="progress"><span style="width:38%"></span></div></div><div class="kpi"><small>روزهای حضور این ماه</small><strong>۱۹</strong><div class="progress"><span style="width:86%"></span></div></div></div></section></div>';
  };

  /* Keep the profile uploaded image in the account menu on rerenders. */
  window.render=(function(prev){return function(){prev();setTimeout(function(){
    const u=current();if(!u)return;
    if(safePhoto(u)){
      document.querySelectorAll('.profile-trigger .avatar').forEach(el=>{el.classList.add('avatar-photo');el.style.backgroundImage='url("'+safePhoto(u)+'")';el.textContent=''});
      document.querySelectorAll('.side-bottom .avatar').forEach(el=>{el.classList.add('avatar-photo');el.style.backgroundImage='url("'+safePhoto(u)+'")';el.textContent=''});
    }
  },0)}})(window.render);

  /* Fix the V6 navigation logger by making its existing logActivity calls harmless for other events. */
  document.addEventListener('click',function(e){
    const btn=e.target.closest('.request-shortcut');
    if(btn){setTimeout(()=>suggestRequestTitle(),35)}
  });
})();
</script>



<style id="v10-page-loader">
.page-loader{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(4,12,28,.34);backdrop-filter:blur(9px) saturate(1.06);-webkit-backdrop-filter:blur(9px) saturate(1.06);opacity:0;visibility:hidden;pointer-events:none;z-index:9998;transition:opacity .16s ease,visibility .16s ease}
.page-loader.show{opacity:1;visibility:visible;pointer-events:auto}
.page-loader-card{width:min(330px,calc(100vw - 36px));padding:24px 22px 20px;border:1px solid color-mix(in srgb,var(--line) 72%,transparent);border-radius:22px;background:color-mix(in srgb,var(--surface) 90%,transparent);box-shadow:0 28px 85px rgba(5,18,44,.22);text-align:center;transform:translateY(8px) scale(.985);opacity:.94;transition:transform .22s ease,opacity .22s ease}
.page-loader.show .page-loader-card{transform:translateY(0) scale(1);opacity:1}
.page-loader-orbit{width:64px;height:64px;margin:0 auto 14px;position:relative;border-radius:50%;background:radial-gradient(circle,var(--surface) 43%,transparent 44%),conic-gradient(from 0deg,var(--accent),var(--primary),var(--lime),var(--accent));animation:pageSpin .72s linear infinite;box-shadow:0 10px 30px var(--glow)}
.page-loader-orbit:before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.page-loader-orbit:after{content:"";position:absolute;width:9px;height:9px;top:4px;right:50%;margin-right:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 18%,transparent),0 0 20px color-mix(in srgb,var(--accent) 55%,transparent)}
.page-loader-title{font-size:12px;font-weight:900;color:var(--text)}
.page-loader-sub{margin-top:4px;font-size:8px;color:var(--muted);min-height:15px}
.page-loader-track{height:4px;margin-top:15px;border-radius:99px;overflow:hidden;background:var(--surface-3)}
.page-loader-track span{display:block;width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent),var(--lime));box-shadow:0 0 14px var(--glow);animation:pageProgress .2s cubic-bezier(.22,.61,.36,1) forwards}
.page-loader-dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.page-loader-dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.25;animation:pageDot .55s ease-in-out infinite}
.page-loader-dots i:nth-child(2){animation-delay:.05s}.page-loader-dots i:nth-child(3){animation-delay:.10s}
@keyframes pageSpin{to{transform:rotate(360deg)}}
@keyframes pageProgress{to{width:100%}}
@keyframes pageDot{0%,100%{transform:translateY(0);opacity:.24}50%{transform:translateY(-3px);opacity:1}}
[data-theme="dark"] .page-loader{background:rgba(2,6,18,.48)}
@media(max-width:560px){.page-loader-card{padding:20px 18px 18px}.page-loader-orbit{width:58px;height:58px}}
@media(prefers-reduced-motion:reduce){.page-loader,.page-loader-card{transition:none}.page-loader-orbit,.page-loader-track span,.page-loader-dots i{animation:none}.page-loader-track span{width:100%}}
</style>

<div id="pageLoader" class="page-loader" aria-hidden="true">
  <div class="page-loader-card" role="status" aria-live="polite" aria-label="در حال بارگذاری صفحه">
    <div class="page-loader-orbit" aria-hidden="true"></div>
    <div id="pageLoaderTitle" class="page-loader-title">در حال بارگذاری</div>
    <div id="pageLoaderSub" class="page-loader-sub">در حال آماده‌سازی صفحه</div>
    <div class="page-loader-track" aria-hidden="true"><span></span></div>
    <div class="page-loader-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</div>

<script id="v10-page-loader-script">
(function(){
  const originalNav=window.nav;
  if(typeof originalNav!=='function') return;
  const labels={
    dashboard:'داشبورد',inbox:'کارتابل من',requests:'درخواست‌ها',attendance:'تردد و کارکرد',approvals:'تأییدها',
    people:'پرسنل',processes:'فرآیندها',reports:'گزارشات',docs:'اسناد و فرم‌ها',notifications:'اعلان‌ها',
    profile:'حساب من',settings:'تنظیمات',support:'راهنما و پشتیبانی'
  };
  let timer=null, sequence=0;
  function ensureLoader(){return document.getElementById('pageLoader')}
  function showLoader(target){
    const el=ensureLoader();
    if(!el) return;
    document.getElementById('pageLoaderTitle').textContent='در حال ورود به '+(labels[target]||'صفحه');
    document.getElementById('pageLoaderSub').textContent='لطفاً لحظه‌ای صبر کنید…';
    const track=el.querySelector('.page-loader-track span');
    if(track){track.style.animation='none';void track.offsetWidth;track.style.animation='pageProgress .5s cubic-bezier(.22,.61,.36,1) forwards'}
    el.classList.add('show');el.setAttribute('aria-hidden','false');
  }
  function hideLoader(){
    const el=ensureLoader();
    if(!el) return;
    el.classList.remove('show');el.setAttribute('aria-hidden','true');
  }
  window.nav=function(target){
    if(!target || typeof target!=='string' || target===page){return originalNav(target)}
    const my=++sequence;
    if(timer) clearTimeout(timer);
    showLoader(target);
    timer=setTimeout(function(){
      if(my!==sequence) return;
      originalNav(target);
      setTimeout(hideLoader,20);
    },200);
  };
  window.addEventListener('beforeunload',function(){if(timer) clearTimeout(timer)});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && document.getElementById('pageLoader')?.classList.contains('show')){
      e.preventDefault();
    }
  },true);
})();
</script>


<script id="v11-login-loader-script">
(function(){
  window.showLoginLoader=function(){
    const el=document.getElementById('pageLoader');
    if(!el)return;
    const title=document.getElementById('pageLoaderTitle');
    const sub=document.getElementById('pageLoaderSub');
    const track=el.querySelector('.page-loader-track span');
    if(title)title.textContent='در حال ورود به سامانه';
    if(sub)sub.textContent='در حال آماده‌سازی محیط کاری شما…';
    if(track){track.style.animation='none';void track.offsetWidth;track.style.animation='pageProgress 1s cubic-bezier(.22,.61,.36,1) forwards';}
    el.classList.add('show');
    el.setAttribute('aria-hidden','false');
  };
  window.hideLoginLoader=function(){
    const el=document.getElementById('pageLoader');
    if(!el)return;
    el.classList.remove('show');
    el.setAttribute('aria-hidden','true');
  };
})();
</script>
