    'مساعده':{help:'مبلغ و علت درخواست مساعده را ثبت کنید.',fields:[['مبلغ درخواستی','amount','number','مثلاً 50000000'],['علت درخواست','reason','text']]},
    'تنخواه':{help:'جزئیات هزینه و مرکز هزینه را مشخص کنید.',fields:[['مبلغ','amount','number'],['مرکز هزینه','costCenter','text'],['شرح هزینه','reason','text']]},
    'دسترسی سامانه':{help:'سامانه، سطح دسترسی و دلیل نیاز را وارد کنید.',fields:[['نام سامانه','systemName','text'],['سطح دسترسی','accessLevel','select',['مشاهده','ثبت و ویرایش','مدیریتی']],['علت نیاز','reason','text']]},
    'خرید تجهیزات':{help:'اقلام موردنیاز و مشخصات خرید را ثبت کنید.',fields:[['شرح تجهیز','item','text'],['تعداد','quantity','number'],['برآورد هزینه','amount','number'],['دلیل خرید','reason','text']]},
    'خروج کالا':{help:'اقلام، مقدار و مقصد خروج را مشخص کنید.',fields:[['شرح کالا','item','text'],['مقدار','quantity','number'],['مقصد','destination','text'],['شماره پروژه/مرکز هزینه','costCenter','text']]},
    'پاسخ استعلام':{help:'مرجع استعلام و موعد پاسخ را ثبت کنید.',fields:[['مرجع استعلام','reference','text'],['موعد پاسخ','dueDate','date'],['موضوع','subject','text']]},
    'تحصیل دارایی':{help:'مشخصات دارایی و ارزش آن را وارد کنید.',fields:[['نام دارایی','assetName','text'],['رده/دسته','assetCategory','text'],['بهای خرید','amount','number'],['شماره سند','documentNo','text']]},
    'ابطال دارایی':{help:'دارایی، دلیل ابطال و وضعیت فیزیکی را مشخص کنید.',fields:[['شماره دارایی','assetId','text'],['دلیل ابطال','reason','text'],['وضعیت فیزیکی','physicalState','select',['قابل استفاده','معیوب','اسقاطی','مفقود']]]},
    'اصلاح تردد':{help:'تاریخ و ساعت صحیح تردد را ثبت کنید.',fields:[['تاریخ','attendanceDate','date'],['ورود صحیح','entry','time'],['خروج صحیح','exit','time'],['دلیل اصلاح','reason','text']]},
    'گواهی اشتغال':{help:'هدف دریافت گواهی را مشخص کنید.',fields:[['هدف دریافت','purpose','text'],['تعداد نسخه','quantity','number']]},
    'آموزش':{help:'دوره آموزشی و زمان موردنظر را ثبت کنید.',fields:[['نام دوره','course','text'],['ارائه‌دهنده','provider','text'],['تاریخ پیشنهادی','courseDate','date'],['دلیل نیاز','reason','text']]}
  };
  const NOTICE_LEVELS={فوری:'danger',مهم:'warn',عادی:'good'};
  function safeJSON(k,d){try{const x=JSON.parse(localStorage.getItem(k)||'');return x??d}catch(e){return d}}
  function putJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  function text(x){return String(x??'')}
  function cat(r){return r?.category||CATEGORY[r?.type]||'سایر'}
  function slaHoursFor(r){return Number(r?.slaHours)||SLA_HOURS[r?.type]||48}
  function ensureSla(r){
    if(!r)return;
    if(!r.slaHours)r.slaHours=slaHoursFor(r);
    if(!r.createdAt)r.createdAt=Date.now();
    if(!r.dueAt && !['تأیید شده','رد شده'].includes(r.status))r.dueAt=r.createdAt+r.slaHours*3600000;
  }
  function persian(n){return Number(n).toLocaleString('fa-IR')}
  function remainingText(r){
    ensureSla(r); if(!r.dueAt || ['تأیید شده','رد شده'].includes(r.status))return 'بدون مهلت فعال';
    const diff=r.dueAt-Date.now(), abs=Math.abs(diff), m=Math.ceil(abs/60000), h=Math.floor(m/60), mins=m%60;
    if(diff<=0)return 'مهلت گذشته · '+(h?persian(h)+' ساعت ':'')+(mins?persian(mins)+' دقیقه':'');
    if(h>=24){const d=Math.floor(h/24),hh=h%24;return persian(d)+' روز '+(hh?persian(hh)+' ساعت ':'')+'باقی‌مانده'}
    return (h?persian(h)+' ساعت ':'')+persian(Math.max(1,mins))+' دقیقه باقی‌مانده';
  }
  function slaHTML(r){ensureSla(r);if(['تأیید شده','رد شده'].includes(r.status))return '<span class="v31-sla good">✓ زمان‌بندی بسته</span>';const diff=(r.dueAt||0)-Date.now();const cls=diff<=0?'danger':diff<6*3600000?'warn':'good';return '<span class="v31-sla '+cls+'" data-sla-due="'+r.dueAt+'">⏱ '+remainingText(r)+'</span>'}
  function startSlaTicker(){
    if(window.__v31SlaTimer)clearInterval(window.__v31SlaTimer);
    window.__v31SlaTimer=setInterval(()=>{document.querySelectorAll('[data-sla-due]').forEach(el=>{const due=Number(el.dataset.slaDue);if(!due)return;const r={dueAt:due,status:''};el.textContent='⏱ '+remainingText(r);el.className='v31-sla '+(due-Date.now()<=0?'danger':due-Date.now()<6*3600000?'warn':'good')})},30000);
  }
  function priority(r){return r?.priority||'عادی'}
  function isOpen(r){return !['تأیید شده','رد شده','برگشت برای اصلاح'].includes(r?.status||'')}
  function reqActiveForUser(){
    const u=current(); if(!u)return [];
    const tickets=safeJSON('companySupportTickets',[]);
    const reqs=(db.req||[]).filter(r=>r.uid===u.id&&isOpen(r));
    const tasks=(db.tasks||[]).filter(t=>t.status==='نیازمند اقدام');
    return {reqs,tasks,tickets:Array.isArray(tickets)?tickets.filter(t=>t.status!=='انجام شده'):[]};
  }
  function insertAfter(el,node){if(el?.parentNode)el.parentNode.insertBefore(node,el.nextSibling)}

  // 1) Dashboard: active items + dashboard personalization.
  window.openDashboardCustomizer=function(){
    const p=safeJSON('companyDashboardPrefs',{today:true,focus:true,active:true,latest:true,notice:true,quick:true});
    const item=(key,label)=>'<label style="display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:9px"><input type="checkbox" data-dash-key="'+key+'" '+(p[key]!==false?'checked':'')+'> '+label+'</label>';
    openModal('شخصی‌سازی داشبورد','<div class="formgrid"><div class="field full"><label>بخش‌های قابل نمایش</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+item('today','کارهای امروز من')+item('focus','دسترسی‌های شخصی')+item('active','موارد فعال من')+item('latest','آخرین درخواست‌ها')+item('notice','آخرین اطلاعیه‌ها')+item('quick','دسترسی سریع عمومی')+'</div></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" onclick="saveDashboardCustomizer()">ذخیره تنظیمات</button></div>');
  };
  window.saveDashboardCustomizer=function(){
    const p=safeJSON('companyDashboardPrefs',{today:true,focus:true,active:true,latest:true,notice:true,quick:true});
    document.querySelectorAll('[data-dash-key]').forEach(x=>p[x.dataset.dashKey]=x.checked);

    return '<section class="card panel"><div class="panel-head"><div><h3>مرکز اعلان‌ها</h3><div class="muted" style="font-size:8px;margin-top:3px">اعلان‌های عادی، مهم و فوری با امکان اقدام مستقیم</div></div><div class="action-row"><span class="badge '+(unread?'yellow':'green')+'">'+unread+' خوانده‌نشده</span><button class="btn btn-secondary" onclick="markAllNoticesRead()">همه خوانده شد</button></div></div><div class="v31-notice-filter"><button class="v31-notice-chip '+(rows==='all'?'active':'')+'" onclick="setNoticeFilter(\'all\')">همه</button><button class="v31-notice-chip '+(rows==='unread'?'active':'')+'" onclick="setNoticeFilter(\'unread\')">خوانده‌نشده</button><button class="v31-notice-chip '+(rows==='urgent'?'active':'')+'" onclick="setNoticeFilter(\'urgent\')">فوری</button><button class="v31-notice-chip '+(rows==='important'?'active':'')+'" onclick="setNoticeFilter(\'important\')">مهم</button></div><div class="notif-list">'+notes.map((n,i)=>{const lev=noticeLevel(n),un=!st[String(i)+'|'+String(n?.[1]||'')];const show=rows==='all'||(rows==='unread'&&un)||(rows==='urgent'&&lev==='فوری')||(rows==='important'&&lev==='مهم');if(!show)return '';return '<div class="notif-item '+(un?'unread':'')+'" onclick="markNoticeRead('+i+')"><div class="nicon">'+n[0]+'</div><div><strong>'+esc(n[1])+'</strong><span>'+esc(n[2])+'</span></div><span class="badge '+(NOTICE_LEVELS[lev]==='danger'?'red':NOTICE_LEVELS[lev]==='warn'?'yellow':'gray')+'">'+lev+'</span></div>'}).join('')||'<div class="empty-state"><strong>اعلانی با این فیلتر نیست</strong></div>'+'</div></section>';
  };
  window.setNoticeFilter=function(v){localStorage.setItem('v31NoticeFilter',v);render()};

  // 9) Enhance request details without replacing existing Timeline/return workflow.
  window.details=function(id){
    if(typeof originalDetails==='function')originalDetails(id);
    setTimeout(()=>{
      const r=(db.req||[]).find(x=>x.id===id),modal=document.querySelector('#modal .modal');if(!r||!modal)return;ensureSla(r);
      if(modal.querySelector('.v31-detail-sla'))return;
      const block=document.createElement('div');block.className='v31-detail-sla';block.innerHTML='<div class="v31-detail-sla-card"><small>مهلت SLA</small><strong>'+slaHTML(r)+'</strong></div><div class="v31-detail-sla-card"><small>صف سازمانی</small><strong>'+esc(cat(r))+' • '+esc(priority(r))+'</strong></div>'+(r.description?'<div class="v31-detail-sla-card" style="grid-column:1/-1"><small>شرح</small><strong>'+esc(r.description)+'</strong></div>':'');
      const head=modal.querySelector('.request-detail-head')||modal.querySelector('.detail-grid');if(head)head.insertAdjacentElement('afterend',block);else modal.prepend(block);
      if(r.formData && Object.keys(r.formData).length){const fd=document.createElement('div');fd.className='panel';fd.style.cssText='margin-top:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:12px';fd.innerHTML='<div class="panel-head"><h3>اطلاعات تخصصی درخواست</h3></div><div class="detail-grid">'+Object.entries(r.formData).map(([k,v])=>'<div class="detail"><small>'+esc(k)+'</small><strong>'+esc(v||'—')+'</strong></div>').join('')+'</div>';block.insertAdjacentElement('afterend',fd)}
      startSlaTicker();
    },35);
  };

  // 10) Global search: keep the existing UI, extend its source set with tasks, tickets, notices and knowledge.
  window.runGlobalSearch=function(){
    const q=String(document.getElementById('globalSearchInput')?.value||'').trim().toLowerCase();const rows=[];const add=(kind,label,sub,type,action,icon)=>{if(!q || (label+' '+sub).toLowerCase().includes(q))rows.push({kind,label,sub,type,action,icon})};
    [['dashboard','داشبورد','نمای کلی سامانه'],['inbox','کارتابل من','موارد نیازمند اقدام'],['requests','درخواست‌ها','ثبت و پیگیری درخواست‌ها'],['attendance','تردد و کارکرد','حضور و ساعت‌زنی'],['processes','فرآیندها','گردش کارهای سازمانی'],['reports','گزارشات','شاخص‌ها و آمار'],['docs','اسناد و فرم‌ها','فرم‌ها و مستندات'],['support','راهنما و پشتیبانی','دانش سازمانی و تیکت'],['notifications','اعلان‌ها','اطلاعیه و یادآوری'],['profile','حساب من','اطلاعات پرسنلی'],['settings','تنظیمات','تم و تجربه کاربری']].forEach(x=>add('page',x[1],x[2],'صفحه','closeGlobalSearch();nav(\''+x[0]+'\')',svg.arrow));
    (window.__processCatalog||[]).forEach((p,i)=>add('process',p.name,'مالک: '+p.owner,'فرآیند','closeGlobalSearch();openProcess('+i+')',svg.process));
    (db.req||[]).forEach(r=>{const u=db.users.find(x=>x.id===r.uid);add('request',r.id+' — '+r.title,(u?.name||'')+' · '+r.status+' · '+cat(r),'درخواست','closeGlobalSearch();details(\''+r.id+'\')',svg.req)});
    (db.tasks||[]).forEach(t=>add('task',t.id+' — '+t.title,(t.req||'')+' · '+t.status,'کار','closeGlobalSearch();nav(\'inbox\')',svg.inbox));
    (db.users||[]).forEach(u=>add('user',u.name,u.role+' · '+u.unit+' · '+u.employeeId,'پرسنل','closeGlobalSearch();nav(\'people\')',svg.user));
    (db.notices||[]).forEach((n,i)=>add('notice',n[1],n[2]+' · '+noticeLevel(n),'اعلان','closeGlobalSearch();nav(\'notifications\')',svg.bell));
    safeJSON('companySupportTickets',[]).forEach(t=>add('ticket',t.id+' — '+t.title,t.category+' · '+t.status,'تیکت','closeGlobalSearch();nav(\'support\')',svg.support));
    KB.forEach(k=>add('knowledge',k.title,k.cat+' · دانش سازمانی','راهنما','closeGlobalSearch();nav(\'support\')',svg.doc));
    const meta=document.getElementById('globalSearchMeta'),list=document.getElementById('globalSearchResults');if(!meta||!list)return;meta.textContent=q?(rows.length+' نتیجه برای «'+q+'»'):'جستجو در کل سامانه';if(!rows.length){list.innerHTML='<div class="empty-state"><strong>نتیجه‌ای پیدا نشد</strong><p>نام، شناسه یا عبارت کوتاه‌تری امتحان کنید.</p></div>';return}
    const groups={page:'دسترسی‌ها',process:'فرآیندها',request:'درخواست‌ها',task:'کارها',user:'پرسنل',notice:'اعلان‌ها',ticket:'تیکت‌ها',knowledge:'راهنما'};let group='';let out='';rows.slice(0,40).forEach(r=>{if(groups[r.kind]!==group){group=groups[r.kind];out+='<div class="search-group-title">'+group+'</div>'}out+='<button class="search-result" onclick="'+r.action+'"><span class="sr-icon">'+r.icon+'</span><span><strong>'+esc(r.label)+'</strong><small>'+esc(r.sub)+'</small></span><span class="sr-type">'+r.type+'</span></button>'});list.innerHTML=out;
  };

  // App launcher button + dashboard hooks after every render.
  function injectTopbarLauncher(){
    const actions=document.querySelector('.top-actions');if(!actions||document.getElementById('v31LauncherBtn'))return;
    const btn=document.createElement('button');btn.id='v31LauncherBtn';btn.className='icon-btn';btn.setAttribute('aria-label','میانبر برنامه‌ها');btn.title='میانبر برنامه‌ها';btn.innerHTML='▦';btn.addEventListener('click',window.openAppLauncher);const command=actions.querySelector('.icon-btn[onclick*="openCommandPalette"]');if(command)actions.insertBefore(btn,command);else actions.insertBefore(btn,actions.firstChild);
  }
  const baseRender=window.render;
  window.render=function(){const r=baseRender?.apply(this,arguments);requestAnimationFrame(()=>{injectTopbarLauncher();injectDashboard();applyDashboardPrefs();startSlaTicker();if(page==='support')renderSupportKnowledge()});return r};
  // Extend topbar's notification counts without restyling: existing topbar already uses mark/read state.
  (db.req||[]).forEach(ensureSla);try{save()}catch(e){}
  requestAnimationFrame(()=>{injectTopbarLauncher();injectDashboard();applyDashboardPrefs();startSlaTicker()});
})();
</script>

<script id="v37-enterprise-features-script">
(function(){
  'use strict';
  const KEY={inbox:'v37InboxMode',draft:'v37RequestDraft'};
  const readJSON=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??d}catch(e){return d}};
  const writeJSON=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const s=v=>esc(v==null?'':v);
  const req=id=>(db.req||[]).find(r=>r.id===id);
  const user=id=>(db.users||[]).find(u=>u.id===id);
  const isMgr=()=>typeof manager==='function'&&manager();

  const SLA={
    'مرخصی':24,'دورکاری':24,'ماموریت اداری':24,'اضافه‌کاری':24,'مساعده':48,'تنخواه':48,'خرید تجهیزات':72,'پاسخ استعلام':48,'قرارداد مالی':120,
    'تحصیل دارایی':48,'ابطال دارایی':48,'خروج کالا':24,'دسترسی سامانه':8,'پشتیبانی فناوری اطلاعات':8,'تعمیر و نگهداری':48,'گواهی اشتغال':24,'معرفی‌نامه اداری':24,'آموزش':72,'اصلاح تردد':24
  };
  const CAT={'مرخصی':'منابع انسانی','دورکاری':'منابع انسانی','ماموریت اداری':'منابع انسانی','اضافه‌کاری':'منابع انسانی','مساعده':'مالی','تنخواه':'مالی','خرید تجهیزات':'تدارکات','قرارداد مالی':'مالی','پاسخ استعلام':'بازرگانی','تحصیل دارایی':'اموال و انبار','ابطال دارایی':'اموال و انبار','خروج کالا':'اموال و انبار','دسترسی سامانه':'فناوری','پشتیبانی فناوری اطلاعات':'فناوری','تعمیر و نگهداری':'خدمات و نگهداری','گواهی اشتغال':'منابع انسانی','معرفی‌نامه اداری':'منابع انسانی','آموزش':'منابع انسانی','اصلاح تردد':'منابع انسانی'};
  const priority=r=>r?.priority||(['قرارداد مالی','دسترسی سامانه'].includes(r?.type)?'مهم':'عادی');
  const slaInfo=r=>{const end=(Number(r?.createdAt)||Date.now())+(Number(r?.slaHours)||SLA[r?.type]||48)*3600000;const rem=end-Date.now();const a=Math.abs(rem);const h=Math.floor(a/3600000),m=Math.floor(a%3600000/60000);return {end,rem,overdue:rem<0,text:rem<0?'موعد گذشته':(h?(' '+h+' ساعت'):(' '+Math.max(1,m)+' دقیقه'))}};
  const ensureMeta=()=>{(db.req||[]).forEach((r,i)=>{if(!r.createdAt)r.createdAt=Date.now()-(i*36e5*30);if(!r.category)r.category=CAT[r.type]||'عمومی';if(!r.priority)r.priority=priority(r);if(!r.slaHours)r.slaHours=SLA[r.type]||48;if(!Array.isArray(r.comments))r.comments=[];if(!Array.isArray(r.attachments))r.attachments=[];if(!Array.isArray(r.audit))r.audit=[];if(!r.currentAssignee){const u=user(r.uid);r.currentAssignee=u?.manager||'مسئول مربوط'}})};
  ensureMeta(); save();
  const audit=(r,action,detail)=>{r.audit=Array.isArray(r.audit)?r.audit:[];r.audit.unshift({action,detail,by:current()?.name||'کاربر',time:new Date().toLocaleString('fa-IR',{dateStyle:'short',timeStyle:'short'})});r.audit=r.audit.slice(0,40)};

  /* 1) Preserve the existing smart request form, only add attachments and duplicate hints. */
  const openReqBase=window.openRequest;
  window.openRequest=function(preselect){
    if(typeof openReqBase==='function')openReqBase(preselect);
    setTimeout(()=>{
      const form=document.querySelector('#modal form.form'); if(!form||form.dataset.v37==='1')return; form.dataset.v37='1';
      if(!document.getElementById('v37Attach')){
        const wrap=document.createElement('div');wrap.className='field full';wrap.innerHTML='<label for="v37Attach">پیوست مدارک <span class="muted">(اختیاری)</span></label><input id="v37Attach" class="control" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.xlsx,.zip"><div id="v37AttachStatus" class="request-form-note">حداکثر ۱ مگابایت برای هر فایل در این دمو.</div>';
        const smart=document.getElementById('v31SmartFields')||document.getElementById('v37SmartFields'); if(smart?.parentNode)smart.parentNode.insertBefore(wrap,smart.nextSibling); else form.querySelector('.modal-actions')?.before(wrap);
      }
      const title=document.getElementById('rtitle');
      const checkDup=()=>{const t=title?.value?.trim()||'',type=document.getElementById('rt')?.value||'';const tokens=new Set(t.toLowerCase().split(/\s+/).filter(x=>x.length>2));const list=(db.req||[]).filter(r=>r.type===type&&tokens.size&&Array.from(tokens).some(x=>(r.title||'').toLowerCase().includes(x))).slice(0,3);let b=document.getElementById('v37DuplicateBox');if(!b){b=document.createElement('div');b.id='v37DuplicateBox';const a=document.getElementById('v37Attach')?.parentNode||form.querySelector('.modal-actions');a?.after(b)}b.className='v37-duplicate';b.innerHTML=list.length?'<strong>درخواست مشابه پیدا شد</strong><br>'+list.map(x=>s(x.id)+' — '+s(x.title)).join('<br>'):'';b.hidden=!list.length};
      title?.addEventListener('input',checkDup);document.getElementById('rt')?.addEventListener('change',checkDup);checkDup();
      document.getElementById('v37Attach')?.addEventListener('change',e=>{const fs=[...(e.target.files||[])],bad=fs.filter(f=>f.size>1048576).length,ok=fs.length-bad;const st=document.getElementById('v37AttachStatus');if(st)st.textContent=ok+' فایل آماده پیوست است'+(bad? '؛ '+bad+' فایل بزرگ رد شد':'')});
      const actions=form.querySelector('.modal-actions');if(actions&&!document.getElementById('v37DraftHint')){const p=document.createElement('span');p.id='v37DraftHint';p.className='v37-draft-pill';p.textContent='پیش‌نویس خودکار فعال است';actions.insertBefore(p,actions.firstChild)}
    },35);
  };

  /* Capture request form data BEFORE the existing submit closes the modal. */
  const submitBase=window.submitRequest;
  window.submitRequest=function(e){
    if(e?.preventDefault)e.preventDefault();
    const before=(db.req||[]).length;
    const type=document.getElementById('rt')?.value||'';
    const formData={};
    document.querySelectorAll('#modal .form input, #modal .form select, #modal .form textarea').forEach(el=>{if(el.id&&el.id!=='rtitle'&&el.id!=='rd'&&el.id!=='rt'&&el.id!=='v37Attach'&&el.id!=='loginOtp')formData[el.closest('.field')?.querySelector('label')?.textContent?.trim()||el.id]=el.value});
    const title=document.getElementById('rtitle')?.value||'',description=document.getElementById('rd')?.value||'';
    const files=[...(document.getElementById('v37Attach')?.files||[])].filter(f=>f.size<=1048576);
    const readFiles=files.map(f=>new Promise(resolve=>{const rd=new FileReader();rd.onload=()=>resolve({name:f.name,size:f.size,type:f.type,data:rd.result});rd.onerror=()=>resolve(null);rd.readAsDataURL(f)}));
    Promise.all(readFiles).then(att=>{
      if(typeof submitBase==='function')submitBase(e);
      const created=(db.req||[]).length>before?db.req[0]:null;
      if(created){ensureMeta();created.createdAt=Date.now();created.slaHours=SLA[created.type]||48;created.category=CAT[created.type]||'عمومی';created.priority=created.priority||'عادی';created.formData={...(created.formData||{}),...formData};created.description=description;created.attachments=att.filter(Boolean);audit(created,'ثبت درخواست','درخواست با فرم هوشمند ثبت شد.');save();}
    });
  };

  /* 2) Kanban inbox */
  const inboxBase=window.inbox;
  window.inbox=function(){
    const mode=localStorage.getItem(KEY.inbox)||'table';
    const rows=isMgr()?(db.tasks||[]):(db.tasks||[]).filter(t=>t.status==='نیازمند اقدام'||(db.req||[]).some(r=>r.uid===current()?.id&&r.id===t.req));
    if(mode!=='board'){
      const html=typeof inboxBase==='function'?inboxBase():'';

 const active=mine.filter(r=>!['تأیید شده','رد شده','انجام شده'].includes(r.status));
 const overdue=active.filter(r=>Number(r.dueAt||0)>0&&Number(r.dueAt)<Date.now());
 const soon=active.filter(r=>Number(r.dueAt||0)>Date.now()&&Number(r.dueAt)-Date.now()<24*3600000);
 const returned=active.filter(r=>r.status==='برگشت برای اصلاح');
 const tasks=(db.tasks||[]).filter(t=>t.status==='نیازمند اقدام').length;
 const p=document.createElement('section');p.className='card panel';p.id='v38TodayPanel';
 const cards=[['نیازمند اقدام',active.length+tasks,'درخواست‌ها و کارهای باز'],['موعد نزدیک',soon.length+overdue.length,'امروز و ۲۴ ساعت آینده'],['برگشت برای اصلاح',returned.length,'تکمیل اطلاعات و ارسال مجدد']];
 p.innerHTML='<div class="panel-head"><div><h3>کارهای امروز من</h3><div class="muted" style="font-size:8px;margin-top:3px">فقط مواردی که نیاز به توجه شما دارند.</div></div><button class="panel-link" type="button" data-go="inbox">مشاهده کارتابل</button></div><div class="v38-today-grid">'+cards.map((c,i)=>'<button class="v38-today-card" type="button" data-go="requests"><div><strong>'+escV(c[0])+'</strong><small>'+escV(c[2])+'</small></div><span class="v38-today-num">'+c[1]+'</span></button>').join('')+'</div><div class="v38-urgency">'+(overdue.length?'<span class="badge red">'+overdue.length+' مورد عقب‌افتاده</span>':'')+(returned.length?'<span class="badge yellow">'+returned.length+' مورد برگشتی</span>':'')+(!overdue.length&&!returned.length?'<span class="badge green">وضعیت امروز عادی است ✓</span>':'')+'</div>';
 p.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>nav(el.dataset.go)));
 return p;
}

window.v38OrgChart=function(){
 const users=Array.isArray(db?.users)?db.users:[];const top=users.find(u=>/مدیرعامل/.test(u.role||''))||users.find(u=>u.u==='admin')||users[0];const managers=users.filter(u=>u!==top&&/مدیر/.test(u.role||''));const employees=users.filter(u=>u!==top&&!managers.includes(u));
 const node=u=>'<button class="v38-org-node" type="button" data-person="'+escV(u.id||'')+'"><span class="avatar">'+escV(u.avatar||'•')+'</span><strong>'+escV(u.name)+'</strong><small>'+escV(u.role)+' · '+escV(u.unit)+'</small></button>';
 const html='<section class="card panel"><div class="panel-head"><div><h3>چارت سازمانی</h3><div class="muted" style="font-size:8px;margin-top:3px">ساختار نمونه بر اساس کاربران سامانه.</div></div><span class="badge gray">'+users.length+' نفر</span></div><div class="v38-org"><div class="v38-org-level">'+(top?node(top):'<div class="empty">مدیریت ارشد ثبت نشده است.</div>')+'</div><div class="v38-org-connector"></div><div class="v38-org-level">'+(managers.length?managers.map(node).join(''):'<div class="empty">مدیر واحد ثبت نشده است.</div>')+'</div><div class="v38-org-connector"></div><div class="v38-org-level">'+(employees.length?employees.map(node).join(''):'<div class="empty">کارمند ثبت نشده است.</div>')+'</div></div></section>';
 return html;
};

const oldCat=window.serviceCatalogPage;
window.serviceCatalogPage=function(){if(typeof oldCat!=='function')return '';const tmp=document.createElement('div');tmp.innerHTML=oldCat();const fav=new Set(readJ('v38ServiceFavorites',[]));tmp.querySelectorAll('.v37-service-card').forEach(btn=>{const name=btn.querySelector('strong')?.textContent?.trim()||'سرویس';const wrap=document.createElement('div');wrap.className='v38-service-card-wrap';btn.parentNode.replaceChild(wrap,btn);wrap.appendChild(btn);const f=document.createElement('button');f.type='button';f.className='v38-fav'+(fav.has(name)?' active':'');f.textContent=fav.has(name)?'★':'☆';f.setAttribute('aria-label',fav.has(name)?'حذف از میانبرهای من':'افزودن سرویس به میانبرهای من');f.addEventListener('click',e=>{e.stopPropagation();const set=new Set(readJ('v38ServiceFavorites',[]));if(set.has(name))set.delete(name);else set.add(name);writeJ('v38ServiceFavorites',[...set]);f.classList.toggle('active',set.has(name));f.textContent=set.has(name)?'★':'☆';toast(set.has(name)?'سرویس به میانبرهای شما اضافه شد':'سرویس از میانبرهای شما حذف شد')});wrap.appendChild(f)});return tmp.innerHTML};

const oldCal=window.calendarPage;
window.calendarPage=function(){if(typeof oldCal!=='function')return '';const tmp=document.createElement('div');tmp.innerHTML=oldCal();const cal=tmp.querySelector('.v37-calendar');if(!cal)return tmp.innerHTML;const ref=new Date();reqs().forEach(r=>{const due=Number(r.dueAt||0);if(!due)return;const d=new Date(due);if(d.getFullYear()!==ref.getFullYear()||d.getMonth()!==ref.getMonth())return;[...cal.querySelectorAll('.v37-day')].forEach(cell=>{const n=Number(cell.querySelector('.v37-day-num')?.textContent||0);if(n===d.getDate()&&!cell.classList.contains('muted')){const e=document.createElement('span');e.className='v37-event';e.textContent='SLA · '+r.id;e.title='موعد SLA برای '+r.id;e.dataset.reqId=r.id;cell.appendChild(e)}})});return tmp.innerHTML};

const oldDetails=window.details;
window.details=function(id){if(typeof oldDetails==='function')oldDetails(id);setTimeout(()=>{const r=reqs().find(x=>x.id===id),m=document.querySelector('#modal .modal');if(!r||!m||m.querySelector('.v38-workbar'))return;const next=r.status==='برگشت برای اصلاح'?'اصلاح اطلاعات و ارسال مجدد':r.status==='در انتظار تأیید'?'بررسی و تصمیم‌گیری':r.status==='نیازمند اطلاعات تکمیلی'?'تکمیل اطلاعات درخواستی':'پیگیری مرحله بعد';const b=document.createElement('div');b.className='v38-workbar';b.innerHTML='<div><strong>اقدام بعدی</strong><br><span>'+escV(next)+'</span></div><div class="v38-action-row"><button type="button" class="btn btn-secondary" id="v38CopyId">کپی شناسه</button></div>';const a=m.querySelector('.v31-detail-sla')||m.querySelector('.detail-grid');if(a)a.insertAdjacentElement('afterend',b);else m.prepend(b);m.querySelector('#v38CopyId')?.addEventListener('click',()=>{if(navigator.clipboard?.writeText)navigator.clipboard.writeText(String(id));toast('شناسه درخواست کپی شد')})},60)};

const oldSidebar=window.sidebar;window.sidebar=function(){const h=typeof oldSidebar==='function'?oldSidebar():'';if(!h||h.includes('v38-org-link'))return h;const add='<button class="nav-btn v38-org-link '+(page==='orgchart'?'active':'')+'" onclick="nav(\'orgchart\')" aria-label="چارت سازمانی"><span class="nav-icon">⌬</span><span>چارت سازمانی</span></button>';return h.replace('</nav>',add+'</nav>')};
const oldTitle=window.pageTitle;window.pageTitle=function(){if(page==='orgchart')return {h:'چارت سازمانی',p:'ساختار واحدها، مدیران و کارکنان'};return typeof oldTitle==='function'?oldTitle():{h:'سامانه',p:''}};
const oldContent=window.content;window.content=function(){if(page==='orgchart')return window.v38OrgChart();return typeof oldContent==='function'?oldContent():''};
const oldRender=window.render;window.render=function(){if(typeof oldRender==='function')oldRender();setTimeout(()=>{if(page==='dashboard'&&!document.getElementById('v38TodayPanel')){const p=todayPanel(),hero=document.querySelector('.hero');if(p&&hero)hero.insertAdjacentElement('afterend',p)};document.querySelectorAll('.v38-org-node').forEach(btn=>{if(btn.dataset.v38bound==='1')return;btn.dataset.v38bound='1';btn.addEventListener('click',()=>{const u=(db.users||[]).find(x=>String(x.id)===String(btn.dataset.person));if(u){nav('people');setTimeout(()=>toast('پروفایل '+u.name+' آماده نمایش است'),20)}})});},0)};
const oldSettings=window.settings;window.settings=function(){const h=typeof oldSettings==='function'?oldSettings():'';if(!h||h.includes('v38PerfControl'))return h;const tmp=document.createElement('div');tmp.innerHTML=h;const sec=document.createElement('section');sec.className='card panel';sec.id='v38PerfControl';const mode=localStorage.getItem('v38PerfMode')||'smart';sec.innerHTML='<div class="panel-head"><div><h3>عملکرد دستگاه</h3><div class="muted" style="font-size:8px;margin-top:3px">کنترل میزان پردازش جلوه‌های غیرضروری، مخصوصاً روی موبایل.</div></div><span class="badge gray">'+(mode==='smart'?'هوشمند':'کامل')+'</span></div><div class="field"><label for="v38PerfSelect">حالت اجرا</label><select id="v38PerfSelect" class="control"><option value="smart" '+(mode==='smart'?'selected':'')+'>هوشمند</option><option value="full" '+(mode==='full'?'selected':'')+'>کامل</option></select></div><div class="v38-mobile-app-note">حالت هوشمند ظاهر رابط را تغییر نمی‌دهد و برای دستگاه‌های کم‌توان، پردازش غیرضروری را کمتر می‌کند.</div>';tmp.appendChild(sec);setTimeout(()=>document.getElementById('v38PerfSelect')?.addEventListener('change',e=>{localStorage.setItem('v38PerfMode',e.target.value);document.documentElement.dataset.perf=e.target.value;toast('حالت عملکرد ذخیره شد')}),0);return tmp.innerHTML};

})();
</script>

</body>
</html>
