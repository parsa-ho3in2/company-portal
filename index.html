:root{

<style id="final-ui-polish">
/* Final daily polish: crisp hover/ripple and smoother focus states without adding visual noise. */
@media (prefers-reduced-motion:no-preference){
  .btn,.icon-btn,.nav-btn,.quick-card,.request-shortcut,.profile-trigger,.pm-item,.search-result,.sm{position:relative;overflow:hidden}
  .btn:after,.icon-btn:after,.quick-card:after,.request-shortcut:after,.profile-trigger:after,.sm:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(255,255,255,.22),transparent 34%);opacity:0;transform:scale(.7);transition:opacity .18s ease,transform .28s ease;pointer-events:none}
  .btn:active:after,.icon-btn:active:after,.quick-card:active:after,.request-shortcut:active:after,.profile-trigger:active:after,.sm:active:after{opacity:1;transform:scale(1)}
}
.control:focus{transform:translateY(-.5px)}
</style>
<script id="final-ui-polish-script">
(function(){
  document.addEventListener('pointerdown',function(e){
    const el=e.target.closest('.btn,.icon-btn,.quick-card,.request-shortcut,.profile-trigger,.sm');
    if(!el)return;
    const r=el.getBoundingClientRect();
    el.style.setProperty('--rx',((e.clientX-r.left)/r.width*100)+'%');
    el.style.setProperty('--ry',((e.clientY-r.top)/r.height*100)+'%');
  },{passive:true});
})();
</script>

<script>
(function(){
  function applyMobileTableLabels(){
    document.querySelectorAll('.table-wrap table').forEach(function(table){
      var headers = Array.from(table.querySelectorAll('thead th')).map(function(th){
        return th.textContent.trim();
      });
      table.querySelectorAll('tbody tr').forEach(function(row){
        Array.from(row.children).forEach(function(cell, i){
          if(!cell.hasAttribute('data-label')){
            cell.setAttribute('data-label', headers[i] || 'اطلاعات');
          }
        });
      });
    });
  }

  window.addEventListener('load', applyMobileTableLabels);

  var root = document.getElementById('app');
  if(root){
    new MutationObserver(function(){
      applyMobileTableLabels();
    }).observe(root, {childList:true, subtree:true});
  }
})();
</script>

<script id="v5-final-fixes">
(function(){
  const nativeTheme=theme;
  window.__v5ApplyPrefs=function(){
    try{
      const root=document.documentElement;
      root.dataset.theme=localStorage.getItem('companyTheme')||'light';
      root.dataset.palette=localStorage.getItem('companyPalette')||'ocean';
      root.dataset.font=localStorage.getItem('companyFont')||'vazir';
      root.dataset.density=localStorage.getItem('companyDensity')||'comfortable';
      root.dataset.motion=localStorage.getItem('companyReduceMotion','0')==='1'?'reduced':'full';
      const meta=document.querySelector('meta[name="theme-color"]');
      if(meta){
        const palette=root.dataset.palette, dark=root.dataset.theme==='dark';
        const map={ocean:['#1977ff','#6aaaff'],violet:['#7657ff','#9a8cff'],emerald:['#0f9b7a','#55d7bb'],sunset:['#ff7a45','#ff9b72'],pinknight:['#ff4fb8','#ff8bd4'],redblack:['#ff3657','#ff7083']};
        meta.setAttribute('content',(map[palette]||map.ocean)[dark?1:0]);
      }
    }catch(e){}
  };
  window.theme=function(){
    const t=nativeTheme();
    __v5ApplyPrefs();
    return t;
  };
  const baseLoginView=loginView;
  window.loginView=function(){
    const html=baseLoginView();
    setTimeout(function(){
      if(document.getElementById('otpCode')){
        if(!loginOtp || Date.now()>otpExpires){refreshOtp();}
        else {document.getElementById('otpCode').textContent=loginOtp;updateOtpTimer(document.getElementById('otpMeta'));}
      }
    },0);
    return html;
  };
  window.setPalette=function(v){
    const allowed=['ocean','violet','emerald','sunset','pinknight','redblack'];
    if(!allowed.includes(v))v='ocean';
    localStorage.setItem('companyPalette',v);__v5ApplyPrefs();render();setTimeout(()=>toast('تم رنگی اعمال شد'),40);
  };
  window.setFont=function(v){
    const allowed=['vazir','noto','tajawal'];
    if(!allowed.includes(v))v='vazir';
    localStorage.setItem('companyFont',v);__v5ApplyPrefs();document.body.offsetHeight;render();setTimeout(()=>toast('فونت رابط اعمال شد'),40);
  };
  window.setDensity=function(v){
    localStorage.setItem('companyDensity',v==='compact'?'compact':'comfortable');__v5ApplyPrefs();render();setTimeout(()=>toast('تراکم رابط اعمال شد'),40);
  };
  window.toggleMotionPref=function(btn){
    const reduced=localStorage.getItem('companyReduceMotion')==='1';
    localStorage.setItem('companyReduceMotion',reduced?'0':'1');__v5ApplyPrefs();
    if(btn)btn.textContent=reduced?'انیمیشن استاندارد فعال است':'حرکت کم‌حجم فعال است';
    toast(reduced?'انیمیشن استاندارد فعال شد':'حرکت‌های اضافی کم شد');
  };
  // Prevent palette/font selections from being lost on repeated renders.
  const oldRender=render;
  window.render=function(){__v5ApplyPrefs();oldRender();requestAnimationFrame(__v5ApplyPrefs)};
  __v5ApplyPrefs();
  // Re-run once so the first login render uses the initialized OTP and preferences.
  requestAnimationFrame(()=>window.render());
})();
</script>

  window.openActivityHistory=function(){
    const arr=Array.isArray(db.activities)?db.activities:[];
    const body=arr.length?'<div class="activity-list">'+arr.map(a=>'<div class="activity-row"><div class="activity-icon">'+esc(a[3]||'•')+'</div><div><strong>'+esc(a[0])+'</strong><p>'+esc(a[1])+'</p></div><time>'+esc(a[2])+'</time></div>').join('')+'</div>':'<div class="empty-state"><div class="empty-icon">'+(svg.clock||'◷')+'</div><strong>سوابقی وجود ندارد</strong></div>';
    openModal('تاریخچه کامل فعالیت‌ها',body+'<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">بستن</button></div>');
  };

  function notificationPanel(){
    const st=notificationState(), notes=db.notices||[], unread=unreadNotices();
    return '<div class="notif-panel" id="notifPanel" role="dialog" aria-label="مرکز اعلان‌ها"><div class="notif-panel-head"><div><strong>مرکز اعلان‌ها</strong><small>'+unread+' اعلان خوانده‌نشده</small></div><button class="panel-link" onclick="nav(\'notifications\')">مشاهده همه</button></div><div class="notif-list">'+(notes.slice(0,5).map((n,i)=>{const isUnread=!st[noticeKey(i,n)];return '<div class="notif-item '+(isUnread?'unread':'')+'" onclick="markNoticeRead('+i+')"><div class="nicon">'+n[0]+'</div><div><strong>'+esc(n[1])+'</strong><span>'+esc(n[2])+'</span></div><span class="unread-dot" aria-hidden="true" style="opacity:'+(isUnread?1:0)+'"></span></div>'}).join('')||'<div class="empty-state"><div class="empty-icon">'+svg.bell+'</div><strong>اعلانی وجود ندارد</strong></div>')+'</div><div class="notif-panel-foot"><button class="btn btn-secondary" onclick="markAllNoticesRead()">علامت‌گذاری همه</button><button class="btn btn-soft" onclick="openGlobalSearch(\'اعلان\')">جستجوی اعلان</button></div></div>';
  }

  window.toggleNotificationPanel=function(force){
    const p=document.getElementById('notifPanel');
    if(!p)return;
    const show=force===true||!p.classList.contains('show');
    document.querySelectorAll('.notif-panel.show').forEach(x=>x.classList.remove('show'));
    if(show){p.classList.add('show');setTimeout(()=>p.querySelector('.notif-item')?.focus?.(),20)}
  };

  window.topbar=function(){
    const c=current(),t=theme(),unread=unreadNotices();
    return '<div class="topbar"><div class="title"><h1>'+pageTitle().h+'</h1><p>'+pageTitle().p+'</p></div><div class="top-actions"><div class="search"><span class="magnify">'+svg.search+'</span><input id="globalTopSearch" class="control" onkeydown="if(event.key===\'Enter\')openGlobalSearch(this.value)" placeholder="جستجو در سامانه..." aria-label="جستجوی سامانه" autocomplete="off"></div><div class="notif-wrap"><button class="icon-btn" onclick="toggleNotificationPanel()" aria-label="اعلان‌ها" title="مرکز اعلان‌ها" aria-haspopup="dialog" aria-expanded="false">'+svg.bell+(unread?'<span class="unread-count">'+(unread>99?'۹۹+':unread)+'</span>':'')+'</button>'+notificationPanel()+'</div><button class="icon-btn" onclick="toggleTheme()" aria-label="تغییر حالت نمایش" title="'+(t==='dark'?'حالت روشن':'حالت تیره')+'">'+(t==='dark'?svg.sun:svg.moon)+'</button><button class="icon-btn" onclick="openCommandPalette()" aria-label="فرمان‌های سریع" title="فرمان‌های سریع (Ctrl+K)">⌘</button><button class="profile-trigger" onclick="openProfileMenu()" aria-expanded="false"><span class="ptxt"><strong>'+esc(c.name)+'</strong><span>'+esc(c.role)+'</span></span><span class="avatar">'+esc(c.avatar)+'</span><span class="chev">⌄</span></button></div></div><div class="profile-menu" role="menu"><div class="pm-head"><strong>'+esc(c.name)+'</strong><span>'+esc(c.unit)+'</span></div><button class="pm-item" onclick="nav(\'profile\')">'+svg.user+' حساب من</button><button class="pm-item" onclick="nav(\'settings\')">'+svg.settings+' تنظیمات</button><button class="pm-item pm-danger" onclick="logout()">'+svg.logout+' خروج</button></div>';
  };

  window.notifications=function(){
    const st=notificationState(),notes=db.notices||[],unread=unreadNotices();
    return '<section class="card panel"><div class="panel-head"><div><h3>مرکز اعلان‌ها</h3><div class="muted" style="font-size:8px;margin-top:3px">اعلان‌ها، یادآوری‌ها و پیام‌های مرتبط با کارهای شما</div></div><div class="action-row"><span class="badge '+(unread?'yellow':'green')+'">'+unread+' خوانده‌نشده</span><button class="btn btn-secondary" onclick="markAllNoticesRead()">همه خوانده شد</button></div></div><div class="filters"><button class="sm primary" onclick="renderNotificationsPage(\'all\')">همه</button><button class="sm" onclick="renderNotificationsPage(\'unread\')">خوانده‌نشده</button></div><div id="notificationsPageList">'+renderNotificationRows('all',st,notes)+'</div></section>';
  };
  function renderNotificationRows(mode,st,notes){
    const rows=(notes||[]).map((n,i)=>({n,i,unread:!st[noticeKey(i,n)]})).filter(x=>mode==='unread'?x.unread:true);
    if(!rows.length)return '<div class="empty-state"><div class="empty-icon">'+svg.bell+'</div><strong>اعلان جدیدی نیست</strong><p>وقتی رویداد تازه‌ای برای حساب شما ایجاد شود، اینجا نمایش داده خواهد شد.</p></div>';
    return '<div class="notif-list">'+rows.map(x=>'<div class="notif-item '+(x.unread?'unread':'')+'" onclick="markNoticeRead('+x.i+')"><div class="nicon">'+x.n[0]+'</div><div><strong>'+esc(x.n[1])+'</strong><span>'+esc(x.n[2])+'</span></div><span class="unread-dot" style="opacity:'+(x.unread?1:0)+'"></span></div>').join('')+'</div>';
  }
  window.renderNotificationsPage=function(mode){
    const el=document.getElementById('notificationsPageList');if(!el)return;el.innerHTML='<div class="skeleton" style="height:150px;border-radius:14px"></div>';setTimeout(()=>{el.innerHTML=renderNotificationRows(mode,notificationState(),db.notices||[])},120)
  };

  window.openGlobalSearch=function(initial){
    let el=document.getElementById('globalSearchBackdrop');
    if(!el){
      el=document.createElement('div');el.id='globalSearchBackdrop';el.className='global-search-backdrop';el.innerHTML='<div class="global-search-box" role="dialog" aria-modal="true" aria-label="جستجوی سراسری"><div class="global-search-head"><span style="color:var(--accent)">'+svg.search+'</span><input id="globalSearchInput" class="control" placeholder="نام، شناسه، فرآیند یا سند را جستجو کنید..." autocomplete="off" oninput="runGlobalSearch()"><button class="icon-btn" onclick="closeGlobalSearch()" aria-label="بستن">'+svg.close+'</button></div><div id="globalSearchMeta" class="global-search-meta"></div><div id="globalSearchResults" class="global-search-results"></div><div class="global-search-foot"><span>برای جستجوی سریع‌تر چند حرف کلیدی کافی است.</span><span><span class="shortcut-key">Esc</span> بستن</span></div></div>';
      document.body.appendChild(el);el.addEventListener('click',e=>{if(e.target===el)closeGlobalSearch()});
    }
    el.classList.add('show');const input=document.getElementById('globalSearchInput');input.value=initial||'';runGlobalSearch();setTimeout(()=>input.focus(),20);
  };
  window.closeGlobalSearch=function(){document.getElementById('globalSearchBackdrop')?.classList.remove('show')};
  window.runGlobalSearch=function(){
    const q=norm(document.getElementById('globalSearchInput')?.value||'');
    const rows=[];
    const pages=[['dashboard','داشبورد','نمای کلی سامانه'],['inbox','کارتابل من','موارد نیازمند اقدام'],['requests','درخواست‌ها','ثبت و پیگیری درخواست‌ها'],['attendance','تردد و کارکرد','حضور و ساعت‌زنی'],['processes','فرآیندها','گردش کارهای سازمانی'],['reports','گزارشات','شاخص‌ها و آمار'],['docs','اسناد و فرم‌ها','فرم‌ها و مستندات'],['notifications','اعلان‌ها','اطلاعیه و یادآوری'],['profile','حساب من','اطلاعات پرسنلی'],['settings','تنظیمات','تم، فونت و تجربه کاربری']];
    pages.forEach(x=>{if(!q||norm(x[1]+' '+x[2]).includes(q))rows.push({kind:'page',label:x[1],sub:x[2],icon:svg.arrow,type:'صفحه',action:'nav("'+x[0]+'")'});});
    (window.__processCatalog||[]).forEach((p,i)=>{const text=p.name+' '+p.owner+' '+p.steps.map(s=>s[0]).join(' ');if(!q||norm(text).includes(q))rows.push({kind:'process',label:p.name,sub:'مالک: '+p.owner,type:'فرآیند',icon:svg.process,action:'closeGlobalSearch();openProcess('+i+')'});});
    (db.req||[]).forEach(r=>{const u=db.users.find(x=>x.id===r.uid);const text=r.id+' '+r.title+' '+r.type+' '+(u?.name||'');if(!q||norm(text).includes(q))rows.push({kind:'request',label:r.id+' — '+r.title,sub:(u?.name||'')+' · '+r.status,type:'درخواست',icon:svg.req,action:'closeGlobalSearch();details("'+r.id+'")'});});
    (db.users||[]).forEach(u=>{const text=u.name+' '+u.role+' '+u.unit+' '+u.employeeId;if(!q||norm(text).includes(q))rows.push({kind:'user',label:u.name,sub:u.role+' · '+u.unit,type:'پرسنل',icon:svg.user,action:'closeGlobalSearch();nav("people")'});});
    ['فرم درخواست مرخصی','فرم درخواست دورکاری','فرم ماموریت اداری','فرم پاسخ استعلام','فرم قرارداد مالی','فرم تحصیل دارایی','فرم ابطال دارایی','فرم خروج کالا'].forEach(d=>{if(!q||norm(d).includes(q))rows.push({kind:'doc',label:d,sub:'مشاهده، چاپ یا دانلود',type:'سند/فرم',icon:svg.doc,action:'closeGlobalSearch();nav("docs")'});});
    const meta=document.getElementById('globalSearchMeta'),list=document.getElementById('globalSearchResults');
    meta.textContent=q?(rows.length+' نتیجه برای «'+q+'»'):'پیشنهادهای سریع و جستجوی سراسری';
    if(!rows.length){list.innerHTML='<div class="empty-state"><div class="empty-icon">'+svg.search+'</div><strong>نتیجه‌ای پیدا نشد</strong><p>عبارت جستجو را کوتاه‌تر کنید یا بخشی از نام، شناسه یا عنوان را وارد کنید.</p></div>';return}
    const groups={page:'دسترسی‌ها',process:'فرآیندها',request:'درخواست‌ها',user:'پرسنل',doc:'اسناد و فرم‌ها'};let html='';let currentGroup='';
    rows.slice(0,30).forEach(r=>{if(groups[r.kind]!==currentGroup){currentGroup=groups[r.kind];html+='<div class="search-group-title">'+currentGroup+'</div>'}html+='<button class="search-result" onclick="'+r.action+'"><span class="sr-icon">'+r.icon+'</span><span><strong>'+esc(r.label)+'</strong><small>'+esc(r.sub)+'</small></span><span class="sr-type">'+r.type+'</span></button>'});
    list.innerHTML=html;
  };

  window.dashboard=function(){return oldDashboard()+window.systemStatus();};
  window.profile=function(){return oldProfile()+window.activityHistory();};
  window.content=function(){
    if(page==='dashboard')return window.dashboard();
    if(page==='profile')return window.profile();
    if(page==='notifications')return window.notifications();
    return oldContent();
  };

  // Search all major surfaces from the top search and add a real activity trail.
  const oldNav=window.nav||nav;
  window.nav=function(p){
    const labels={dashboard:'داشبورد',inbox:'کارتابل',requests:'درخواست‌ها',attendance:'تردد و کارکرد',approvals:'تأییدها',people:'پرسنل',processes:'فرآیندها',reports:'گزارشات',docs:'اسناد و فرم‌ها',notifications:'اعلان‌ها',profile:'حساب من',settings:'تنظیمات'};
    if(session&&page!==p) logActivity('مشاهده بخش سامانه','ورود به '+(labels[p]||p),'◉');
    oldNav(p);
  };

  const oldLogin=window.login||login;
  window.login=function(){
    const before=session?.id;
    oldLogin();
    if(!before&&session?.id){logActivity('ورود موفق به سامانه','نشست کاربری جدید ایجاد شد','✓');render();}
  };
  const oldLogout=window.logout||logout;
  window.logout=function(){
    if(session&&current())logActivity('خروج از سامانه','نشست کاربری پایان یافت','→');
    oldLogout();
  };
  const oldSubmit=window.submitRequest||submitRequest;
  window.submitRequest=function(e){oldSubmit(e)};
  const oldDecide=window.decide||decide;
  window.decide=function(id,status){oldDecide(id,status);logActivity('تغییر وضعیت درخواست',id+' · '+status,status==='تأیید شده'?'✓':'!');render();};

  document.addEventListener('click',function(e){
    const panel=document.getElementById('notifPanel'), wrap=e.target.closest('.notif-wrap');
    if(panel&&panel.classList.contains('show')&&!wrap){panel.classList.remove('show')}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeGlobalSearch();document.getElementById('notifPanel')?.classList.remove('show')}
  });

  const originalRender=window.render;
  window.render=function(){
    window.applyPrefs?.();
    document.documentElement.dataset.motion=(localStorage.getItem('companyReduceMotion')||'0')==='1'?'reduced':'full';
    document.getElementById('app').innerHTML=session&&current()?window.shell():loginView();
    bindOutside();
    requestAnimationFrame(()=>{window.applyPrefs?.();document.querySelector('.content')?.classList.add('page-enter');});
  };
  window.render();
})();
</script>


<style id="v7-final-polish">
/* Clearer Persian typography */
html,body,button,input,select,textarea{font-synthesis:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-weight:500}
.nav-btn,.btn,.field label,.panel-head h3,.title h1,.hero h2,.stat strong,.card h3,.process-card h4,.detail strong,.command-item span,.search-result strong{font-weight:700}
th,.badge,.sm,.palette-choice strong,.font-choice strong,.profile-title h2{font-weight:700}
.profile-title h2{letter-spacing:-.25px}
.muted,.detail small,.notice span,.timeline-item p,.activity-row p{font-weight:500}
.font-sample{font-weight:700!important;font-size:14px!important;letter-spacing:-.15px}
.font-choice{min-height:94px!important}
.control{font-weight:500}
::placeholder{opacity:.72}

/* Profile editing / avatar */
.profile-actions{align-items:center;flex-wrap:wrap}
.profile-actions .btn{min-height:40px}
.avatar-photo{background-position:center;background-size:cover;background-repeat:no-repeat;color:transparent!important;background-color:var(--surface-3)!important}
.profile-photo-editor{display:grid;grid-template-columns:90px 1fr;gap:15px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.profile-photo-preview{width:78px;height:78px;border-radius:22px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--accent-soft),var(--surface));color:var(--accent);font-size:27px;font-weight:800;border:1px solid var(--line)}
.profile-photo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.profile-photo-actions{display:flex;gap:8px;flex-wrap:wrap}
.profile-edit-note{font-size:8px;color:var(--muted);line-height:1.9;margin-top:7px}

/* Request catalog */
.request-catalog{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.request-shortcut{border:1px solid var(--line);background:linear-gradient(145deg,var(--surface),var(--surface-2));border-radius:14px;padding:12px;text-align:right;cursor:pointer;transition:.18s ease;position:relative;overflow:hidden}
.request-shortcut:after{content:"";position:absolute;width:90px;height:90px;left:-35px;bottom:-45px;border-radius:50%;background:var(--glow);pointer-events:none}
.request-shortcut:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:0 12px 28px var(--glow)}
.request-shortcut .rs-icon{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:8px}
.request-shortcut strong{display:block;font-size:10px;font-weight:700}
.request-shortcut span{display:block;margin-top:3px;font-size:8px;color:var(--muted);line-height:1.7}
.request-form-note{margin-top:6px;font-size:8px;color:var(--muted)}
@media(max-width:900px){.request-catalog{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.request-catalog{grid-template-columns:1fr}.profile-photo-editor{grid-template-columns:1fr;text-align:center}.profile-photo-actions{justify-content:center}}
</style>

<script id="v7-final-patch">
(function(){
  const __v7OldSidebar=window.sidebar;
  const __v7OldTopbar=window.topbar;
  const __v7OldProfile=window.profile;

  function safePhoto(u){
    return (u && typeof u.avatarImage==='string' && u.avatarImage.indexOf('data:image/')===0) ? u.avatarImage : '';
  }
  function avatarMarkup(u, tag){
    const t=tag||'div', photo=safePhoto(u);
    const attrs=photo ? ' class="avatar avatar-photo" style="background-image:url(\''+photo.replace(/'/g,'%27')+'\')" aria-label="تصویر پروفایل"' : ' class="avatar"';
    return '<'+t+attrs+'>'+(photo?'':esc(u?.avatar||'ک'))+'</'+t+'>';
  }
  function editValue(id, fallback){const el=document.getElementById(id);return el?el.value.trim():fallback}
  function profileSnapshot(){
    const u=current();
    if(!u) return null;
    return u;
  }

  /* Only the useful activity types remain visible/stored in the profile trail. */
  function isUsefulActivity(title){
    return /^(ورود موفق به سامانه|خروج از سامانه|ثبت درخواست(?: جدید)?)/.test(String(title||''));
  }
  window.logActivity=function(title,detail,time,icon){
    if(!session||!current()||!isUsefulActivity(title)) return;
    db.activities=Array.isArray(db.activities)?db.activities:[];
    db.activities.unshift([title,detail,time||'همین الان',icon||'•']);
    db.activities=db.activities.filter(a=>isUsefulActivity(a?.[0])).slice(0,60);
    save();
  };
  db.activities=Array.isArray(db.activities)?db.activities.filter(a=>isUsefulActivity(a?.[0])).slice(0,60):[];
  save();

  window.activityHistory=function(){
    const arr=Array.isArray(db.activities)?db.activities.filter(a=>isUsefulActivity(a?.[0])):[];
    const shown=arr.slice(0,6);
    return '<section class="card panel"><div class="panel-head"><div><h3>فعالیت‌های اخیر</h3><div class="muted" style="font-size:8px;margin-top:3px">ورود، خروج و ثبت درخواست</div></div><span class="badge gray">'+arr.length+' رویداد</span></div>'+
      (shown.length?'<div class="activity-list">'+shown.map(a=>'<div class="activity-row"><div class="activity-icon">'+esc(a[3]||'•')+'</div><div><strong>'+esc(a[0])+'</strong><p>'+esc(a[1])+'</p></div><time>'+esc(a[2])+'</time></div>').join('')+'</div>':'<div class="empty-state"><div class="empty-icon">'+(svg.clock||'◷')+'</div><strong>هنوز فعالیتی ثبت نشده</strong><p>سوابق ورود، خروج و ثبت درخواست‌ها اینجا نمایش داده می‌شوند.</p></div>')+'</section>';
  };
  window.openActivityHistory=function(){
    const arr=Array.isArray(db.activities)?db.activities.filter(a=>isUsefulActivity(a?.[0])):[];
    const body=arr.length?'<div class="activity-list">'+arr.map(a=>'<div class="activity-row"><div class="activity-icon">'+esc(a[3]||'•')+'</div><div><strong>'+esc(a[0])+'</strong><p>'+esc(a[1])+'</p></div><time>'+esc(a[2])+'</time></div>').join('')+'</div>':'<div class="empty-state"><div class="empty-icon">'+(svg.clock||'◷')+'</div><strong>سوابقی وجود ندارد</strong></div>';
    openModal('سوابق ورود، خروج و ثبت درخواست',body+'<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">بستن</button></div>');
  };

  /* Replace default avatar initials with uploaded profile photos where available. */
  if(typeof __v7OldSidebar==='function'){
    window.sidebar=function(){
      const c=current(), html=__v7OldSidebar();
      if(c && safePhoto(c)) return html.replace('<div class="avatar">'+esc(c.avatar)+'</div>',avatarMarkup(c,'div'));
      return html;
    };
  }
  if(typeof __v7OldTopbar==='function'){
    window.topbar=function(){
      const c=current(), html=__v7OldTopbar();
      if(c && safePhoto(c)) return html.replace('<span class="avatar">'+esc(c.avatar)+'</span>',avatarMarkup(c,'span'));
      return html;
    };
  }

  function profilePhotoPreview(u){
    const photo=safePhoto(u);
    return photo?'<img src="'+photo+'" alt="پیش‌نمایش تصویر پروفایل">':esc(u?.avatar||'ک');
  }
  window.previewProfilePhoto=function(ev){
    const file=ev?.target?.files?.[0]; if(!file) return;
    if(!file.type.startsWith('image/')){toast('فقط فایل تصویری انتخاب کنید');return}
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){

<script id="v10-page-loader-script">
(function(){
  const originalNav=window.nav;
  if(typeof originalNav!=='function') return;
  const labels={
    dashboard:'داشبورد',inbox:'کارتابل من',requests:'درخواست‌ها',attendance:'تردد و کارکرد',approvals:'تأییدها',
    people:'پرسنل',processes:'فرآیندها',reports:'گزارشات',docs:'اسناد و فرم‌ها',notifications:'اعلان‌ها',
    profile:'حساب من',settings:'تنظیمات',support:'راهنما و پشتیبانی'
  };
  let timer=null, sequence=0;
  function ensureLoader(){return document.getElementById('pageLoader')}
  function showLoader(target){
    const el=ensureLoader();
    if(!el) return;
    document.getElementById('pageLoaderTitle').textContent='در حال ورود به '+(labels[target]||'صفحه');
    document.getElementById('pageLoaderSub').textContent='لطفاً لحظه‌ای صبر کنید…';
    const track=el.querySelector('.page-loader-track span');
    if(track){track.style.animation='none';void track.offsetWidth;track.style.animation='pageProgress .5s cubic-bezier(.22,.61,.36,1) forwards'}
    el.classList.add('show');el.setAttribute('aria-hidden','false');
  }
  function hideLoader(){
    const el=ensureLoader();
    if(!el) return;
    el.classList.remove('show');el.setAttribute('aria-hidden','true');
  }
  window.nav=function(target){
    if(!target || typeof target!=='string' || target===page){return originalNav(target)}
    const my=++sequence;
    if(timer) clearTimeout(timer);
    showLoader(target);
    timer=setTimeout(function(){
      if(my!==sequence) return;
      originalNav(target);
      setTimeout(hideLoader,20);
    },200);
  };
  window.addEventListener('beforeunload',function(){if(timer) clearTimeout(timer)});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && document.getElementById('pageLoader')?.classList.contains('show')){
      e.preventDefault();
    }
  },true);
})();
</script>

    canvas.height=Math.max(1,Math.floor(h*dpr));
    canvas.style.width=w+'px'; canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildAmbientNetwork();
  }
  window.addEventListener('resize',resize,{passive:true});

  function cssVar(name,fallback){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  }
  function rand(a,b){return a+Math.random()*(b-a)}
  function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
  function easeOut(t){return 1-Math.pow(1-t,3)}

  function uiOccluderAt(x,y){
    const el=document.elementFromPoint(x,y);
    if(!el || el===canvas) return null;
    return el.closest('.sidebar,.main,.card,.panel,.hero,.table-wrap,.profile-cover,.profile-main,.quick-card,.kpi,.detail,.support-hero,.support-grid');
  }

  // Controls should keep their normal click behavior. Structural UI containers may still
  // trigger a burst so the original click interaction is not lost when the web is underneath them.
  function isLightningTarget(target){
    if(!document.querySelector('.app')) return false;
    if(!target) return true;
    if(target.closest('.page-loader,.modal-backdrop,button,a,input,select,textarea,[role="button"],[contenteditable="true"],.profile-trigger,.profile-menu,.control,.sm,.icon-btn,.otp-refresh')) return false;
    return !!target.closest('#app,.app,.sidebar,.main,.content,.hero,.card,.panel,.table-wrap,.quick-card,.kpi,.detail,.profile-cover,.profile-main,.support-hero,.support-grid');
  }

  function makeBranch(cx,cy,angle,len,depth){
    const perp={x:-Math.sin(angle),y:Math.cos(angle)};
    const points=[{x:cx,y:cy}];
    let x=cx,y=cy;
    const steps=depth?rand(5,7):rand(6,10);
    for(let i=1;i<=steps;i++){
      const p=i/steps;
      const stepLen=len/steps;
      x += Math.cos(angle + rand(-0.13,0.13))*stepLen;
      y += Math.sin(angle + rand(-0.13,0.13))*stepLen;
      const jitter=Math.sin(p*Math.PI)*rand(-1,1)*(depth?8:13);
      x += perp.x*jitter; y += perp.y*jitter;
      points.push({x,y});
    }
    return points;
  }

  function createBurst(x,y){
    const now=performance.now();
    if(now-lastSpawn<45 && active.length>=MAX_ACTIVE) return;
    lastSpawn=now;
    const roots=[];
    const rootCount=Math.floor(rand(8,13));
    const baseRadius=Math.min(w,h);
    for(let i=0;i<rootCount;i++){
      const angle=(Math.PI*2/rootCount)*i+rand(-0.22,0.22);
      const len=baseRadius*rand(.10,.19);
      const points=makeBranch(x,y,angle,len,0);
      const children=[];
      const childCount=Math.random()<.8?Math.floor(rand(1,3)):0;
      for(let c=0;c<childCount;c++){
        const idx=Math.floor(rand(2,points.length-2));
        const p=points[idx];
        const dir=(Math.atan2(points[idx+1].y-p.y,points[idx+1].x-p.x)) + (Math.random()<.5?-1:1)*rand(.45,.95);
        children.push({points:makeBranch(p.x,p.y,dir,len*rand(.18,.34),1),start:idx});
      }
      roots.push({points,children});
    }
    const sparks=[];
    roots.forEach(r=>r.points.slice(-2,-1).forEach(p=>{
      if(Math.random()<.85) sparks.push({x:p.x,y:p.y,dx:rand(-.7,.7),dy:rand(-.7,.7),r:rand(.7,1.8)});
    }));
    const occluder=uiOccluderAt(x,y);
    active.push({x,y,roots,sparks,start:now,occluder});
    while(active.length>MAX_ACTIVE) active.shift();
  }

  function drawBranch(points,progress,width,alpha){
    const total=points.length-1;
    if(total<=0 || progress<=0) return;
    const scaled=progress*total;
    const full=Math.floor(scaled);
    const frac=scaled-full;
    ctx.beginPath();
    ctx.moveTo(points[0].x,points[0].y);
    for(let i=1;i<=full && i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
    if(full<total){
      const a=points[full],b=points[full+1];
      ctx.lineTo(a.x+(b.x-a.x)*frac,a.y+(b.y-a.y)*frac);
    }
    ctx.lineWidth=width;
    ctx.globalAlpha=alpha;
    ctx.stroke();
  }

  function buildAmbientNetwork(){
    net.length=0;
    const cols=isMobile?Math.max(4,Math.min(7,Math.round(w/190))):Math.max(7,Math.min(12,Math.round(w/150)));
    const rows=isMobile?Math.max(3,Math.min(5,Math.round(h/190))):Math.max(5,Math.min(9,Math.round(h/145)));
    const dx=cols>1?w/(cols-1):w, dy=rows>1?h/(rows-1):h;
    const pts=[];
    for(let y0=0;y0<rows;y0++){
      for(let x0=0;x0<cols;x0++){
        const edge=x0===0||x0===cols-1||y0===0||y0===rows-1;
        pts.push({
          x:x0*dx+rand(-dx*.11,dx*.11),
          y:y0*dy+rand(-dy*.11,dy*.11),
          phase:rand(0,Math.PI*2),
          weight:edge?rand(.72,1):rand(.55,.9)
        });
      }
    }
    const idx=(x0,y0)=>y0*cols+x0;
    for(let y0=0;y0<rows;y0++){
      for(let x0=0;x0<cols;x0++){
        const p=pts[idx(x0,y0)];
        if(x0<cols-1) net.push(makeAmbientLine(p,pts[idx(x0+1,y0)]));
        if(y0<rows-1) net.push(makeAmbientLine(p,pts[idx(x0,y0+1)]));
        if(x0<cols-1&&y0<rows-1&&Math.random()<.55) net.push(makeAmbientLine(p,pts[idx(x0+1,y0+1)]));
        if(x0>0&&y0<rows-1&&Math.random()<.35) net.push(makeAmbientLine(p,pts[idx(x0-1,y0+1)]));
      }
    }
  }

  function makeAmbientLine(a,b){
    const vx=b.x-a.x, vy=b.y-a.y, len=Math.hypot(vx,vy)||1;
    const nx=-vy/len, ny=vx/len;
    const steps=Math.max(4,Math.min(8,Math.round(len/95)));
    const points=[{x:a.x,y:a.y}];
    for(let i=1;i<steps;i++){
      const t=i/steps;
      const jitter=Math.sin(t*Math.PI)*rand(-10,10);
      points.push({x:a.x+vx*t+nx*jitter,y:a.y+vy*t+ny*jitter});
    }
    points.push({x:b.x,y:b.y});
    return {points,phase:rand(0,Math.PI*2),speed:rand(.55,1.15),alpha:rand(.10,.18)};
  }

  function deformPoint(p,now,phase){
    if(!pointer.active) return p;
    const dx=p.x-pointer.x,dy=p.y-pointer.y,dist=Math.hypot(dx,dy)||1;
    const radius=Math.min(w,h)*.27;
    if(dist>radius) return {x:p.x,y:p.y,boost:0};
    const q=1-dist/radius;
    const push=q*q*(18+42*pointer.pressure);
    const curl=q*q*14;
    const nx=dx/dist,ny=dy/dist,tx=-ny,ty=nx;
    return {
      x:p.x+nx*push+tx*Math.sin(now*.004+(phase||0))*curl,
      y:p.y+ny*push+ty*Math.sin(now*.004+(phase||0))*curl,
      boost:q
    };
  }

  function drawAmbient(now){
    if(!net.length) return;
    const primary=cssVar('--accent','#1977ff');
    const good=cssVar('--accent-good','#b9ff2d');
    const bg=cssVar('--bg','#f4f7fb');
    const dark=document.documentElement.dataset.theme==='dark'||bg.startsWith('#0');
    ctx.save();
    ctx.globalCompositeOperation='screen';
    const pulse=.88+.12*Math.sin(now*.0017);
    net.forEach(line=>{
      let path=line.points,boost=0;
      if(pointer.active){
        path=[];
        for(let i=0;i<line.points.length;i++){
          const d=deformPoint(line.points[i],now,line.phase);
          path.push(d);
          boost=Math.max(boost,d.boost||0);
        }
      }
      ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);
      const gradient=ctx.createLinearGradient(path[0].x,path[0].y,path[path.length-1].x,path[path.length-1].y);
      gradient.addColorStop(0,good);gradient.addColorStop(.5,primary);gradient.addColorStop(1,good);
      ctx.strokeStyle=gradient;
      ctx.lineWidth=.78+boost*1.18;
      ctx.globalAlpha=(dark?.05625:.02625)*(1+boost*2.4)*pulse*line.weight;
      ctx.shadowColor=primary;
      ctx.shadowBlur=boost>0?.5+boost*2.5:0;
      ctx.stroke();
      if(pointer.active && boost>.22){
        const idx=1+Math.floor((path.length-2)*(0.35+0.3*Math.abs(Math.sin(now*.002+line.phase))));
        const sp=path[Math.min(path.length-2,idx)];
        ctx.fillStyle=good;ctx.globalAlpha=(dark?.075:.03375)*boost;
        ctx.beginPath();ctx.arc(sp.x,sp.y,.7+boost*1.7,0,Math.PI*2);ctx.fill();
      }
    });
    if(pointer.active){
      const r=Math.min(w,h)*.17*(.72+pointer.pressure*.35);
      const g=ctx.createRadialGradient(pointer.x,pointer.y,0,pointer.x,pointer.y,r);
      g.addColorStop(0,good);g.addColorStop(.07,primary);g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.globalAlpha=dark?.024:.009;ctx.beginPath();ctx.arc(pointer.x,pointer.y,r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  let lastDrawTime=0;
  const frameInterval=isMobile?33:22;
  function draw(now){
    if(document.hidden){setTimeout(()=>requestAnimationFrame(draw),180);return;}
    if(now-lastDrawTime<frameInterval){requestAnimationFrame(draw);return;}
    lastDrawTime=now;
    ctx.clearRect(0,0,w,h);
    pointer.x += (targetPointer.x-pointer.x)*.18;
    pointer.y += (targetPointer.y-pointer.y)*.18;
    pointer.pressure += (targetPointer.pressure-pointer.pressure)*.18;
    pointer.active=targetPointer.active;
    drawAmbient(now);

    const primary=cssVar('--accent','#1977ff');
    const good=cssVar('--accent-good','#b9ff2d');
    const bg=cssVar('--bg','#f4f7fb');
    const isDark=document.documentElement.dataset.theme==='dark'||bg.startsWith('#0');
    for(let i=active.length-1;i>=0;i--) if(now-active[i].start>=duration+70) active.splice(i,1);

    active.forEach(burst=>{
      const t=clamp((now-burst.start)/duration,0,1);
      const appear=easeOut(clamp(t/.46,0,1));
      const fade=1-clamp((t-.46)/.54,0,1);
      const strength=(isDark?.735:.57)*fade;
      ctx.save();ctx.globalCompositeOperation='screen';
      const grad=ctx.createLinearGradient(burst.x-20,burst.y-20,burst.x+20,burst.y+20);
      grad.addColorStop(0,good);grad.addColorStop(.52,primary);grad.addColorStop(1,good);
      ctx.strokeStyle=grad;ctx.shadowColor=primary;ctx.shadowBlur=13.5;
      burst.roots.forEach(root=>{
        drawBranch(root.points,appear,1.55,strength);
        root.children.forEach(ch=>drawBranch(ch.points,clamp((appear-.15)*1.28,0,1),1.08,strength*.78));
      });
      ctx.shadowBlur=5;ctx.fillStyle=good;ctx.globalAlpha=strength*.9;
      ctx.beginPath();ctx.arc(burst.x,burst.y,3+5*(1-t),0,Math.PI*2);ctx.fill();
      burst.sparks.forEach((sp,i)=>{
        const pulse=.5+.5*Math.sin((now-burst.start)*.018+i*1.7);
        ctx.globalAlpha=strength*pulse;
        ctx.beginPath();ctx.arc(sp.x,sp.y,sp.r*(.8+pulse*.5),0,Math.PI*2);ctx.fill();
      });
      // A restrained edge glow lets a burst clicked on top of a card feel like it is underneath it.
      if(burst.occluder){
        const rect=burst.occluder.getBoundingClientRect();
        if(rect.width>0&&rect.height>0){
          const px=clamp((burst.x-rect.left)/rect.width,0,1),py=clamp((burst.y-rect.top)/rect.height,0,1);
          const edge=Math.min(Math.min(px,1-px)*2,Math.min(py,1-py)*2);
          if(edge<.42){
            ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=strength*(.135*(1-edge/.42));
            ctx.strokeStyle=good;ctx.shadowColor=primary;ctx.shadowBlur=9;ctx.lineWidth=2;
            const m=3;ctx.strokeRect(rect.left-m,rect.top-m,rect.width+2*m,rect.height+2*m);ctx.restore();
          }
        }
      }
      ctx.restore();
    });
    requestAnimationFrame(draw);
  }

  function updatePointer(e,pressure){
    targetPointer.x=e.clientX;targetPointer.y=e.clientY;targetPointer.active=true;targetPointer.pressure=pressure;
  }
  // V26 performance pass: click/touch burst lightning is intentionally disabled.
  // Ambient network + pointer deformation remain active.
  function handleBurstEvent(){ return; }

  resize();
  requestAnimationFrame(draw);

  document.addEventListener('pointermove',function(e){
    if(e.pointerType==='mouse'||e.pointerType==='pen') updatePointer(e,clamp(e.pressure||.35,.15,1));
  },{passive:true});
  document.addEventListener('pointerup',function(e){if(e.pointerType!=='touch') targetPointer.active=false;},{passive:true});
  document.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse') targetPointer.active=false;},{passive:true});
  let touchFrame=0;
  let pendingTouch=null;
  document.addEventListener('touchmove',function(e){
    const t=e.touches[0];
    if(!t) return;
    pendingTouch={clientX:t.clientX,clientY:t.clientY};
    if(touchFrame) return;
    touchFrame=requestAnimationFrame(function(){
      if(pendingTouch){updatePointer(pendingTouch,.55);pendingTouch=null;}
      touchFrame=0;
    });
  },{passive:true});
  document.addEventListener('touchend',function(){pendingTouch=null;targetPointer.active=false;},{passive:true});
})();
</script>

  'use strict';
  const root=document.documentElement, body=document.body;
  const key={contrast:'companyA11yContrast',focus:'companyA11yFocus',scale:'companyA11yScale'};
  const panel=document.getElementById('a11yPanel'), launcher=document.getElementById('a11yLauncher');
  const close=document.getElementById('a11yClose');
  const btnContrast=document.getElementById('a11yContrast'),btnMotion=document.getElementById('a11yMotion'),btnFocus=document.getElementById('a11yFocus'),btnReset=document.getElementById('a11yReset');
  const minus=document.getElementById('a11yMinus'),plus=document.getElementById('a11yPlus'),scaleValue=document.getElementById('a11yScaleValue'),scaleText=document.getElementById('a11yScaleText');
  const motionKey='companyReduceMotion';
  function get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function isExcludedTextParent(el){
    if(!el || el.nodeType!==1) return true;
    if(el===panel || panel.contains(el) || el===launcher) return true;
    if(el.closest('#a11yPanel,#a11yLauncher')) return true;
    if(el.matches('script,style,noscript,svg,svg *,path,circle,rect,ellipse,line,polyline,polygon,select,option,textarea')) return true;
    if(el.matches('.icon,.nav-icon,.stat-icon,.qicon,.sc-icon,.process-icon,.timeline-dot,.avatar,.brand-mark,.notif-dot,.service-dot,.otp-code,.otp-refresh,.close,.a11y-close')) return true;
    if(el.getAttribute('aria-hidden')==='true') return true;
    return false;
  }
  function unwrapScaledText(){
    document.querySelectorAll('span[data-a11y-text]').forEach(function(span){
      const parent=span.parentNode;
      if(!parent) return;
      while(span.firstChild) parent.insertBefore(span.firstChild,span);
      parent.removeChild(span);
    });
  }
  function wrapTextNodes(rootNode){
    if(!rootNode) return;
    const walker=document.createTreeWalker(rootNode,NodeFilter.SHOW_TEXT,{
      acceptNode:function(node){
        if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const p=node.parentElement;
        return isExcludedTextParent(p) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[];
    let n;
    while((n=walker.nextNode())) nodes.push(n);
    nodes.forEach(function(node){
      const p=node.parentElement;
      if(!p || isExcludedTextParent(p)) return;
      const span=document.createElement('span');
      span.setAttribute('data-a11y-text','1');
      span.style.display='inline';
      const base=parseFloat(getComputedStyle(p).fontSize);
      span.dataset.a11yBaseFont=String(Number.isFinite(base)&&base>0?base:16);
      node.parentNode.insertBefore(span,node);
      span.appendChild(node);
    });
  }
  function applyTextScale(){
    const raw=get(key.scale,'100');
    const scale=Math.max(100,Math.min(120,Number(raw)||100))/100;
    unwrapScaledText();
    wrapTextNodes(document.body);
    document.querySelectorAll('span[data-a11y-text]').forEach(function(span){
      const base=parseFloat(span.dataset.a11yBaseFont||'');
      if(Number.isFinite(base) && base>0){
        span.style.fontSize=(base*scale).toFixed(2)+'px';
      }
    });
  }
  function resetTextScaleInline(){
    unwrapScaledText();
  }
  function apply(){
    root.dataset.a11yScale=get(key.scale,'100');
    root.dataset.a11yFocus=get(key.focus,'1');
    body.classList.toggle('a11y-high-contrast',get(key.contrast,'0')==='1');
    root.dataset.motion=get(motionKey,'0')==='1'?'reduced':'full';
    const scale=get(key.scale,'100');
    scaleValue.textContent=scale+'٪';
    scaleText.textContent=scale==='120'?'خیلی بزرگ':(scale==='110'?'بزرگ':'متعادل');
    btnContrast.classList.toggle('active',get(key.contrast,'0')==='1');
    btnFocus.classList.toggle('active',get(key.focus,'1')==='1');
    btnMotion.classList.toggle('active',get(motionKey,'0')==='1');
    document.querySelectorAll('.toast').forEach(function(t){t.setAttribute('role','status');t.setAttribute('aria-live','polite')});
    document.querySelectorAll('.sidebar .nav-btn').forEach(function(b){b.removeAttribute('aria-current')});
    document.querySelectorAll('.sidebar .nav-btn.active').forEach(function(b){b.setAttribute('aria-current','page')});
    requestAnimationFrame(applyTextScale);
  }
  function openPanel(){panel.classList.add('show');panel.setAttribute('aria-hidden','false');launcher.setAttribute('aria-expanded','true');setTimeout(function(){close.focus()},20)}
  function closePanel(){panel.classList.remove('show');panel.setAttribute('aria-hidden','true');launcher.setAttribute('aria-expanded','false');launcher.focus()}
  launcher.addEventListener('click',function(){panel.classList.contains('show')?closePanel():openPanel()});
  close.addEventListener('click',closePanel);
  btnContrast.addEventListener('click',function(){const v=get(key.contrast,'0')==='1'?'0':'1';set(key.contrast,v);apply();toast(v==='1'?'کنتراست بیشتر فعال شد':'کنتراست استاندارد فعال شد')});
  btnFocus.addEventListener('click',function(){const v=get(key.focus,'1')==='1'?'0':'1';set(key.focus,v);root.dataset.a11yFocus=v;apply();toast(v==='1'?'فوکوس واضح فعال شد':'فوکوس استاندارد فعال شد')});
  btnMotion.addEventListener('click',function(){const v=get(motionKey,'0')==='1'?'0':'1';set(motionKey,v);root.dataset.motion=v==='1'?'reduced':'full';apply();toast(v==='1'?'حرکت‌های اضافی کم شد':'حرکت استاندارد فعال شد')});
  function changeScale(v){const n=Math.max(100,Math.min(120,v));set(key.scale,String(n));apply();toast('اندازه متن: '+n+'٪')}
  minus.addEventListener('click',function(){changeScale(Number(get(key.scale,'100'))-10)});
  plus.addEventListener('click',function(){changeScale(Number(get(key.scale,'100'))+10)});
  btnReset.addEventListener('click',function(){set(key.contrast,'0');set(key.focus,'1');set(key.scale,'100');set(motionKey,'0');resetTextScaleInline();document.querySelectorAll('[data-a11y-base-font]').forEach(function(el){delete el.dataset.a11yBaseFont;el.style.removeProperty('font-size')});apply();toast('تنظیمات دسترسی بازنشانی شد')});
  document.addEventListener('keydown',function(e){
    if(e.altKey && e.key.toLowerCase()==='a'){e.preventDefault();panel.classList.contains('show')?closePanel():openPanel();return}
    if(e.key==='Escape' && panel.classList.contains('show')){e.preventDefault();closePanel();return}
    if(e.key==='Tab' && panel.classList.contains('show')){
      const focusable=Array.from(panel.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')).filter(function(el){return !el.disabled && el.offsetParent!==null});
      if(!focusable.length)return;
      const first=focusable[0],last=focusable[focusable.length-1];
      if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus()}
      else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus()}
    }
  },true);
  const oldRender=window.render;
  if(typeof oldRender==='function'){
    window.render=function(){const r=oldRender.apply(this,arguments);requestAnimationFrame(apply);return r};
  }
  apply();
})();
</script>

<script id="v23-icon-scale-guard">
(function(){
  function guard(){
    document.querySelectorAll('.icon,.nav-icon,.stat-icon,.qicon,.sc-icon,.process-icon,.timeline-dot,.avatar,.brand-mark,.notif-dot,.service-dot,.otp-refresh').forEach(function(el){
      el.style.removeProperty('font-size');
    });
  }
  guard();
  const root=document.getElementById('app');
  if(root)new MutationObserver(guard).observe(root,{childList:true,subtree:true});
})();
</script>

<script id="v26-business-ux-script">
(function(){
  'use strict';
  const oldDashboard=window.dashboard;
  const oldRequests=window.requests;
  const oldDetails=window.details;
  const categoryKey='companyRequestCategory';
  const categoryMap={
    'مرخصی':'منابع انسانی','دورکاری':'منابع انسانی','ماموریت اداری':'منابع انسانی','اضافه‌کاری':'منابع انسانی','مساعده':'مالی','تنخواه':'مالی',
    'خرید تجهیزات':'تدارکات','پشتیبانی فناوری اطلاعات':'فناوری','دسترسی سامانه':'فناوری','تعمیر و نگهداری':'خدمات و نگهداری',
    'گواهی اشتغال':'منابع انسانی','معرفی‌نامه اداری':'منابع انسانی','آموزش':'منابع انسانی','کارت و تردد':'منابع انسانی',
    'پاسخ استعلام':'اداری','قرارداد مالی':'مالی','تحصیل دارایی':'اموال و انبار','ابطال دارایی':'اموال و انبار','خروج کالا':'اموال و انبار'
  };
  const categoryList=['همه','منابع انسانی','مالی','فناوری','تدارکات','اداری','اموال و انبار','خدمات و نگهداری'];
  function safe(s){return typeof esc==='function'?esc(s):String(s??'')}
  function currentCategory(){return localStorage.getItem(categoryKey)||'همه'}
  function attentionPanel(){
    const u=current();
    const tasks=(db.tasks||[]).filter(t=>t.status==='نیازمند اقدام');
    const mine=manager()?tasks:tasks.filter(t=>t.uid===u?.id || t.id==='TSK-298');
    const rows=mine.slice(0,4).map(t=>'<div class="attention-item"><div class="attention-icon">!</div><div><strong>'+safe(t.title)+'</strong><small>'+safe(t.req||t.id)+' · موعد '+safe(t.due||'—')+'</small></div>'+badge(t.status)+'</div>').join('');
    const count=mine.length;
    return '<section class="card panel attention-panel"><div><div class="panel-head"><div><h3>کارهای من</h3><div class="muted" style="font-size:8px;margin-top:3px">مواردی که همین حالا نیاز به اقدام دارند</div></div><span class="badge '+(count?'yellow':'green')+'">'+count+' مورد</span></div><div class="attention-list">'+(rows||'<div class="empty-state"><div class="empty-icon">✓</div><strong>کار معوقی ندارید</strong><p>در حال حاضر موردی برای اقدام فوری در کارتابل شما نیست.</p></div>')+'</div></div><aside class="attention-side"><h3>تمرکز امروز</h3><p>اول مواردی را انجام دهید که موعد نزدیک‌تر یا تأیید مدیریتی دارند.</p><div class="attention-number">'+count+'</div><div class="muted" style="font-size:8px">مورد نیازمند اقدام</div><div class="modal-actions"><button class="btn btn-primary" onclick="nav(\'inbox\')">باز کردن کارتابل</button></div></aside></section>';
  }
  window.dashboard=function(){
    const base=typeof oldDashboard==='function'?oldDashboard():'';
    const marker='</section><div class="cards">';
    return base.includes(marker)?base.replace(marker,'</section>'+attentionPanel()+'<div class="cards">'):base+attentionPanel();
  };
  function requestCategoryBar(){
    const active=currentCategory();
    return '<div class="request-categories" role="tablist" aria-label="دسته‌بندی درخواست‌ها">'+categoryList.map(c=>'<button type="button" class="request-category '+(active===c?'active':'')+'" onclick="setRequestCategory(\''+safe(c).replace(/'/g,"\\'")+'\')" role="tab" aria-selected="'+(active===c)+'">'+safe(c)+'</button>').join('')+'</div>';
  }
  window.setRequestCategory=function(cat){localStorage.setItem(categoryKey,cat||'همه');render()};
  window.requests=function(){
    const mine=manager()?(db.req||[]):(db.req||[]).filter(r=>r.uid===current()?.id);
    const active=currentCategory();
    const filtered=active==='همه'?mine:mine.filter(r=>(categoryMap[r.type]||'اداری')===active);
    const catalog=(typeof window.__requestCatalog!=='undefined'?window.__requestCatalog:[]);
    const quickPool=active==='همه'?catalog.slice(0,8):catalog.filter(x=>(categoryMap[x[0]]||'اداری')===active).slice(0,8);
    const icons=[svg.req,svg.clock||'◴',svg.people,svg.chart,svg.settings,svg.doc,svg.shield,svg.process];
    const quick=quickPool.map((x,i)=>'<button class="request-shortcut" onclick="openRequest(\''+String(x[0]).replace(/'/g,"\\'")+'\')"><span class="rs-icon">'+(icons[i]||svg.req)+'</span><strong>'+safe(x[0])+'</strong><span>'+safe(x[1])+'</span></button>').join('');
    const rows=filtered.length?filtered.map(r=>'<tr><td>'+safe(r.id)+'</td><td>'+safe(r.type)+'</td><td>'+safe(r.title)+'</td><td>'+safe(db.users.find(u=>u.id===r.uid)?.name||'')+'</td><td>'+safe(r.date)+'</td><td>'+safe(r.stage)+'</td><td>'+badge(r.status)+'</td><td><button class="sm primary" onclick="details(\''+safe(r.id).replace(/'/g,"\\'")+'\')">'+svg.eye+' جزئیات</button></td></tr>').join(''):'<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">'+svg.req+'</div><strong>در این دسته درخواستی وجود ندارد</strong><p>برای ثبت یک مورد جدید، از دسترسی‌های بالا استفاده کنید.</p></div></td></tr>';
    return '<section class="card panel"><div class="panel-head"><div><h3>درخواست‌ها</h3><div class="muted" style="font-size:8px;margin-top:3px">انتخاب خدمت از دسته مرتبط و پیگیری سوابق ثبت‌شده</div></div><button class="btn btn-primary" onclick="openRequest()">'+svg.plus+' ثبت درخواست جدید</button></div>'+requestCategoryBar()+'<div class="request-group-note"><span>'+safe(active==='همه'?'همه خدمات سازمانی':active)+'</span><span>'+quickPool.length+' خدمت سریع</span></div>'+(quick?'<div class="request-catalog">'+quick+'</div>':'')+'<div class="filters"><select class="control"><option>همه وضعیت‌ها</option><option>در انتظار تأیید</option><option>تأیید شده</option><option>در حال بررسی</option><option>رد شده</option></select><input class="control wide" placeholder="جستجوی عنوان یا شناسه..." aria-label="جستجوی درخواست‌ها"></div><div class="table-wrap"><table><thead><tr><th>شناسه</th><th>نوع</th><th>عنوان</th><th>ثبت‌کننده</th><th>تاریخ</th><th>مرحله</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
  };
  function workflow(r){
    const stages=['ثبت درخواست','بررسی و تأیید','اجرا / اقدام نهایی','پایان فرآیند'];
    const idx=r.status==='رد شده'?1:(r.status==='تأیید شده'?3:2);
    return '<div class="workflow-timeline">'+stages.map((s,i)=>{
      const done=i<idx,cur=i===idx&&!done;
      const time=i===0?r.date:(done?'انجام شد':(cur?'در حال بررسی':'—'));
      const desc=i===0?'درخواست در سامانه ثبت شده است.':i===1?safe(r.stage||'بررسی توسط مسئول مربوط'):i===2?'پس از تأیید، اقدام اجرایی انجام می‌شود.':'پس از تکمیل مراحل، درخواست بسته می‌شود.';
      return '<div class="workflow-step '+(done?'done ':'')+(cur?'current':'')+'"><div class="workflow-dot">'+(done?'✓':(i+1))+'</div><div><strong>'+s+'</strong><p>'+desc+'</p></div><time>'+time+'</time></div>';
    }).join('')+'</div>';
  }
  window.details=function(id){
    const r=(db.req||[]).find(x=>x.id===id); if(!r)return;
    const p=(db.users||[]).find(x=>x.id===r.uid);
    const currentOwner=manager()?safe(p?.name||'کارشناس مسئول'):safe(r.stage||'در حال بررسی');
    const html='<div class="detail-grid"><div class="detail"><small>عنوان</small><strong>'+safe(r.title)+'</strong></div><div class="detail"><small>ثبت‌کننده</small><strong>'+safe(p?.name||'')+'</strong></div><div class="detail"><small>وضعیت</small><strong>'+badge(r.status)+'</strong></div><div class="detail"><small>مرحله فعلی</small><strong>'+safe(r.stage||'—')+'</strong></div></div><div class="detail-status-strip"><div class="detail-status"><small>مالک فعلی</small><strong>'+currentOwner+'</strong></div><div class="detail-status"><small>شناسه</small><strong>'+safe(r.id)+'</strong></div><div class="detail-status"><small>تاریخ ثبت</small><strong>'+safe(r.date)+'</strong></div><div class="detail-status"><small>اقدام بعدی</small><strong>'+safe(r.status==='تأیید شده'?'تکمیل / بستن':r.status==='رد شده'?'اصلاح و ثبت مجدد':'بررسی و تصمیم')+'</strong></div></div><div style="height:12px"></div><div class="panel" style="background:var(--surface-2);border:1px solid var(--line);border-radius:13px"><div class="panel-head"><div><h3>گردش کار درخواست</h3><div class="muted" style="font-size:8px;margin-top:3px">وضعیت هر مرحله و اقدام بعدی</div></div></div>'+workflow(r)+'</div><div class="modal-actions">'+(manager()&&r.status==='در انتظار تأیید'?'<button class="btn btn-success" onclick="closeModal();decide(\''+safe(id).replace(/'/g,"\\'")+'\',\'تأیید شده\')">تأیید درخواست</button><button class="btn btn-danger" onclick="closeModal();decide(\''+safe(id).replace(/'/g,"\\'")+'\',\'رد شده\')">رد درخواست</button>':'')+'<button class="btn btn-secondary" onclick="closeModal()">بستن</button></div>';
    openModal('جزئیات '+safe(id),html);
  };
})();
</script>

<script id="v27-usability-script">
(function(){
  'use strict';
  const DRAFT_KEY='companyPortalRequestDraft';

  function isTypingTarget(el){
    return !!el && (el.matches('input,textarea,select,[contenteditable="true"]') || el.closest('.modal-backdrop,.command-backdrop,.global-search-backdrop'));
  }
  function showDraftBar(form){
    if(!form || form.querySelector('.request-draft-bar')) return;
    const bar=document.createElement('div');
    bar.className='request-draft-bar';
    bar.innerHTML='<span id="requestDraftStatus">پیش‌نویس به‌صورت خودکار در همین مرورگر ذخیره می‌شود.</span><span class="request-draft-actions"><button type="button" class="sm" id="clearRequestDraft">پاک‌کردن پیش‌نویس</button><span class="keyboard-hint">Ctrl+S ذخیره موقت</span></span>';
    form.appendChild(bar);
    const clear=bar.querySelector('#clearRequestDraft');
    clear?.addEventListener('click',function(){localStorage.removeItem(DRAFT_KEY);const rt=document.getElementById('rt'),t=document.getElementById('rtitle'),d=document.getElementById('rd');if(t)t.value='';if(d)d.value='';const st=document.getElementById('requestDraftStatus');if(st)st.textContent='پیش‌نویس پاک شد.';});
  }
  function restoreDraft(){
    let draft=null;try{draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null')}catch(e){draft=null}
    if(!draft) return;
    const rt=document.getElementById('rt'),t=document.getElementById('rtitle'),d=document.getElementById('rd');
    if(rt && draft.type && Array.from(rt.options).some(o=>o.value===draft.type)) rt.value=draft.type;
    if(t && draft.title) t.value=draft.title;
    if(d && draft.description) d.value=draft.description;
    const st=document.getElementById('requestDraftStatus');if(st)st.textContent='پیش‌نویس قبلی بازیابی شد.';
  }
  function wireRequestDraft(){
    const form=document.querySelector('#modal form.form');
    if(!form || !document.getElementById('rt') || !document.getElementById('rtitle') || !document.getElementById('rd')) return;
    showDraftBar(form);
    restoreDraft();
    let timer=null;
    const saveDraft=()=>{
      const draft={type:document.getElementById('rt')?.value||'',title:document.getElementById('rtitle')?.value||'',description:document.getElementById('rd')?.value||'',savedAt:Date.now()};
      if(!draft.type && !draft.title && !draft.description){localStorage.removeItem(DRAFT_KEY);return}
      localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));
      const st=document.getElementById('requestDraftStatus');if(st)st.textContent='پیش‌نویس ذخیره شد · '+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
    };
    form.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(saveDraft,280)}, {passive:true});
    form.addEventListener('change',saveDraft,{passive:true});
    form.addEventListener('submit',()=>localStorage.removeItem(DRAFT_KEY),{once:true});
    window.__saveRequestDraft=saveDraft;
  }

  const oldOpenRequest=window.openRequest;
  window.openRequest=function(preselect){
    if(typeof oldOpenRequest==='function') oldOpenRequest(preselect);
    setTimeout(wireRequestDraft,20);
  };

  // Search/filter the rendered request and inbox tables without re-rendering the page.
  function wireTableFilters(){
    const requestTable=document.querySelector('.content table');
    if(page==='requests' && requestTable){
      const wrap=requestTable.closest('.card.panel');
      const controls=wrap?.querySelectorAll('.filters .control');
      if(controls?.length){
        const selects=Array.from(controls).filter(x=>x.tagName==='SELECT');
        const input=Array.from(controls).find(x=>x.tagName==='INPUT');
        if(selects[0]) selects[0].id='requestStatusFilter';
        if(input) input.id='requestSearchFilter';
        const count=document.createElement('span');count.className='filter-count';count.id='requestFilterCount';
        const head=wrap.querySelector('.request-group-note');head?.appendChild(count);
        const apply=()=>{
          const status=selects[0]?.value||'همه وضعیت‌ها';
          const q=(input?.value||'').trim().toLowerCase();
          let visible=0;
          requestTable.querySelectorAll('tbody tr').forEach(row=>{
            if(row.classList.contains('empty-filter-row')) return;
            const txt=row.textContent.toLowerCase();
            const statusCell=row.children[6]?.textContent.trim()||'';
            const okStatus=!status||status==='همه وضعیت‌ها'||statusCell.includes(status);
            const okQuery=!q||txt.includes(q);
            row.classList.toggle('row-hidden',!(okStatus&&okQuery));
            if(okStatus&&okQuery) visible++;
          });
          if(count) count.textContent=visible+' مورد نمایش داده شد';
        };
        selects.forEach(s=>s.addEventListener('change',apply));
        input?.addEventListener('input',apply);
        apply();
      }
    }
    if(page==='inbox'){
      const table=document.querySelector('.content table');
      const wrap=table?.closest('.card.panel');
      const controls=wrap?.querySelectorAll('.filters .control');
      if(table&&controls?.length){
        const selects=Array.from(controls).filter(x=>x.tagName==='SELECT');
        const input=Array.from(controls).find(x=>x.tagName==='INPUT');
        const apply=()=>{
          const status=selects[0]?.value||'همه وضعیت‌ها', type=selects[1]?.value||'همه انواع', q=(input?.value||'').trim().toLowerCase();
          table.querySelectorAll('tbody tr').forEach(row=>{
            const txt=row.textContent.toLowerCase();
            const cells=Array.from(row.children).map(c=>c.textContent.trim());
            const okStatus=status==='همه وضعیت‌ها'||cells[4]?.includes(status);
            const okType=type==='همه انواع'||txt.includes(type.toLowerCase());
            const okQ=!q||txt.includes(q);
            row.classList.toggle('row-hidden',!(okStatus&&okType&&okQ));
          });
        };
        selects.forEach(s=>s.addEventListener('change',apply));
        input?.addEventListener('input',apply);
        apply();
      }
    }
  }

  // Add a copy-ID action to request details without changing the existing detail layout.
  const oldDetails=window.details;
  window.details=function(id){
    if(typeof oldDetails!=='function') return;
    oldDetails(id);
    setTimeout(()=>{
      const modal=document.querySelector('#modal .modal');
      if(!modal || modal.querySelector('#copyRequestId')) return;
      const actions=modal.querySelector('.modal-actions');
      if(!actions) return;
      const b=document.createElement('button');
      b.type='button';b.id='copyRequestId';b.className='btn btn-secondary';b.textContent='کپی شناسه';
      b.addEventListener('click',async()=>{
        try{await navigator.clipboard.writeText(String(id));toast('شناسه '+id+' کپی شد')}catch(e){toast('کپی خودکار در این مرورگر در دسترس نیست')}});
      actions.insertBefore(b,actions.firstChild);
    },20);
  };

  // Small keyboard layer for common actions; never hijacks text entry.
  let gPending=false;
  document.addEventListener('keydown',function(e){
    if(isTypingTarget(e.target)){
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&document.getElementById('requestDraftStatus')){e.preventDefault();window.__saveRequestDraft?.();}
      return;
    }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k') return; // existing command palette owns this.
    if(e.key==='/'){e.preventDefault();window.openGlobalSearch?.('');return;}
    if(e.key.toLowerCase()==='g'){gPending=true;setTimeout(()=>gPending=false,900);return;}
    if(gPending){
      gPending=false;
      const map={d:'dashboard',i:'inbox',r:'requests',a:'approvals',p:'profile',s:'settings'};
      if(map[e.key.toLowerCase()]){e.preventDefault();window.nav?.(map[e.key.toLowerCase()]);}
    }
    if(e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();window.openRequest?.();}
  });

  const originalRender=window.render;
  window.render=function(){
    if(typeof originalRender==='function') originalRender();
    setTimeout(wireTableFilters,30);
  };
  window.addEventListener('load',()=>setTimeout(wireTableFilters,50));
  setTimeout(wireTableFilters,50);
})();
</script>

<script id="v29-workflow-personal-dashboard-script">
(function(){
  const statusText=r=>r?.status||'';
  const isDone=r=>['تأیید شده','رد شده','انجام شده'].includes(statusText(r));
  const isReturned=r=>statusText(r)==='برگشت برای اصلاح';
  const stageLabel=r=>r?.stage||'در انتظار اقدام';
  const roleLabel=u=>manager()?'مدیریتی':(u?.role||'کاربری');

  function ensureHistory(r){
    if(!r) return [];
    if(!Array.isArray(r.timeline)) r.timeline=[];
    if(r.timeline.length===0){
      r.timeline=[
        {title:'ثبت درخواست',text:'درخواست در سامانه ثبت شد.',state:'done',date:r.date||'ثبت شده'},
        {title:r.stage||'بررسی و اقدام',text:r.status==='در انتظار تأیید'?'منتظر اقدام مرحله بعد است.':'مرحله جاری فرآیند.',state:isReturned(r)?'returned':(isDone(r)?'done':'current'),date:r.status==='در انتظار تأیید'?'در انتظار':(r.status||'')},
        {title:'پایان فرآیند',text:'پس از نهایی شدن گردش کار تکمیل می‌شود.',state:isDone(r)?'done':'future',date:isDone(r)?'انجام شد':'—'}
      ];
    }
    return r.timeline;
  }

  function pushHistory(r,title,text,state,date){
    ensureHistory(r);
    r.timeline.forEach(x=>{if(x.state==='current')x.state='done'});
    r.timeline.push({title,text,state:state||'current',date:date||'همین الان'});
  }

  function currentTodayTasks(){
    const u=current();
    if(!u) return [];
    const today=db.tasks.filter(t=>{
      if(manager()) return t.status==='نیازمند اقدام' || t.due==='امروز';
      return t.status==='نیازمند اقدام' || (db.req.some(r=>r.uid===u.id && r.id===t.req && isReturned(r)));
    });
    const ownReq=db.req.filter(r=>r.uid===u.id && (r.status==='برگشت برای اصلاح' || r.status==='در حال بررسی'));
    const mapped=ownReq.map(r=>({id:r.id,title:r.status==='برگشت برای اصلاح'?'اصلاح و ارسال مجدد درخواست':r.title,req:r.id,due:r.status==='برگشت برای اصلاح'?'امروز':'پیگیری',status:r.status,kind:'request'}));
    const seen=new Set();
    return [...today.map(t=>({...t,kind:'task'})),...mapped].filter(x=>{const k=x.kind+':'+(x.id||x.req);if(seen.has(k))return false;seen.add(k);return true}).slice(0,6);
  }

  function focusCards(u){
    const employee=[
      ['openRequest()',svg.plus,'ثبت درخواست','مرخصی، دورکاری، مأموریت و خدمات'],
      ['nav(\'requests\')',svg.req,'پیگیری درخواست‌ها','وضعیت و مسیر گردش درخواست‌ها'],
      ['nav(\'attendance\')','◴','تردد و کارکرد','ثبت و بررسی کارکرد ماهانه'],
      ['nav(\'support\')',svg.support,'پشتیبانی','ثبت و پیگیری تیکت‌های سامانه']
    ];
    const managerial=[
      ['nav(\'approvals\')',svg.check,'تأییدهای من','موارد منتظر تصمیم'],
      ['nav(\'inbox\')',svg.inbox,'کارتابل','کارهای ارجاع‌شده'],
      ['nav(\'requests\')',svg.req,'درخواست‌ها','مشاهده و پیگیری گردش‌ها'],
      ['nav(\'reports\')',svg.chart,'گزارشات','شاخص‌های عملیاتی']
    ];
    const arr=manager()?managerial:employee;
    return arr.map(x=>'<div class="quick-card" onclick="'+x[0]+'"><div class="qicon">'+x[1]+'</div><strong>'+x[2]+'</strong><span>'+x[3]+'</span></div>').join('');
  }

  function personalDashboard(){
    const u=current(), mine=db.req.filter(r=>r.uid===u.id), today=currentTodayTasks();
    const pendingMine=mine.filter(r=>!isDone(r) && !isReturned(r)).length;
    const correctionMine=mine.filter(isReturned).length;
    const managerWaiting=db.req.filter(r=>r.status==='در انتظار تأیید').length;
    const primaryCount=manager()?managerWaiting:today.length;
    const todayRows=today.length?today.map(t=>{
      const req=t.req?db.req.find(r=>r.id===t.req):null;
      const returned=req&&isReturned(req);
      return '<button class="today-item" onclick="'+(req?'details(\''+req.id+'\')':'nav(\'inbox\')')+'"><span class="today-icon">'+(returned?'↻':(t.kind==='task'?svg.check:svg.req))+'</span><span><strong>'+esc(t.title)+'</strong><p>'+(req?esc(req.type)+' • '+esc(req.stage):'ارجاع‌شده در کارتابل')+'</p></span><span class="today-meta">'+badge(returned?'برگشت برای اصلاح':(t.status||'نیازمند اقدام'))+'</span></button>';
    }).join(''):'<div class="empty">برای امروز مورد فوری ندارید. ✅</div>';

    return '<section class="personal-dashboard">'+
      '<div class="today-grid">'+
        '<section class="card panel"><div class="panel-head"><div><h3>کارهای امروز من</h3><div class="muted" style="font-size:8px;margin-top:3px">تمرکز بر اقدام‌هایی که واقعاً نیاز به توجه دارند</div></div><span class="badge '+(primaryCount?'yellow':'green')+'">'+primaryCount+' مورد</span></div><div class="today-list">'+todayRows+'</div></section>'+ 
        '<section class="card panel"><div class="panel-head"><div><h3>نمای شخصی '+(manager()?'مدیر':'کاربر')+'</h3><div class="muted" style="font-size:8px;margin-top:3px">خلاصه بر اساس نقش و وضعیت کارهای شما</div></div></div><div class="kpis"><div class="kpi"><small>نیازمند اقدام</small><strong>'+primaryCount+'</strong><div class="progress"><span style="width:'+(primaryCount?Math.min(100,primaryCount*22):0)+'%"></span></div></div><div class="kpi"><small>درخواست‌های باز من</small><strong>'+pendingMine+'</strong><div class="progress"><span style="width:'+(pendingMine?55:0)+'%"></span></div></div><div class="kpi"><small>برگشت برای اصلاح</small><strong>'+correctionMine+'</strong><div class="progress"><span style="width:'+(correctionMine?72:0)+'%"></span></div></div></div></section>'+ 
      '</div>'+ 
      '<section class="card panel"><div class="panel-head"><div><h3>دسترسی‌های شخصی</h3><div class="muted" style="font-size:8px;margin-top:3px">میانبرهایی که با نقش شما مرتبط‌ترند</div></div></div><div class="personal-focus">'+focusCards(u)+'</div></section>'+ 
    '</section>';
  }

  window.dashboard=function(){
    const c=current(),mine=db.req.filter(r=>r.uid===c.id);const open=manager()?db.req.filter(r=>r.status==='در انتظار تأیید').length:db.tasks.filter(t=>t.status==='نیازمند اقدام').length;
    return '<section class="hero liquid-surface"><div><h2>سلام '+esc(c.name.split(' ')[0])+' 👋</h2><p>امروز '+open+' مورد برای پیگیری در سامانه دارید. از اینجا می‌توانید سریع به کارهای مهم دسترسی پیدا کنید.</p></div><div class="hero-actions"><button class="btn btn-primary" onclick="openRequest()">'+svg.plus+' ثبت درخواست</button><button class="btn btn-secondary" onclick="nav(\'inbox\')">'+svg.inbox+' مشاهده کارتابل</button></div></section>'+ 
      '<div class="cards"><div class="card stat"><div class="stat-top"><span class="stat-label">کارتابل باز</span><span class="stat-icon">'+svg.inbox+'</span></div><strong>'+open+'</strong><span class="note warn">نیازمند اقدام</span></div><div class="card stat"><div class="stat-top"><span class="stat-label">درخواست‌های من</span><span class="stat-icon">'+svg.req+'</span></div><strong>'+mine.length+'</strong><span class="note ok">ثبت و پیگیری شده</span></div><div class="card stat"><div class="stat-top"><span class="stat-label">مرخصی باقی‌مانده</span><span class="stat-icon">◷</span></div><strong>۱۸</strong><span class="note">روز کاری</span></div><div class="card stat"><div class="stat-top"><span class="stat-label">اعلان‌های جدید</span><span class="stat-icon">'+svg.bell+'</span></div><strong>'+db.notices.length+'</strong><span class="note">آخرین اطلاعیه‌ها</span></div></div>'+ 
      personalDashboard()+ 
      '<div class="grid2"><section class="card panel"><div class="panel-head"><h3>آخرین درخواست‌ها</h3><button class="panel-link" onclick="nav(\'requests\')">مشاهده همه</button></div><div class="table-wrap"><table><thead><tr><th>شناسه</th><th>موضوع</th><th>ثبت‌کننده</th><th>تاریخ</th><th>وضعیت</th></tr></thead><tbody>'+db.req.slice(0,5).map(r=>'<tr><td>'+r.id+'</td><td>'+esc(r.title)+'</td><td>'+esc(db.users.find(u=>u.id===r.uid)?.name||'')+'</td><td>'+r.date+'</td><td>'+badge(r.status)+'</td></tr>').join('')+'</tbody></table></div></section><section class="card panel"><div class="panel-head"><h3>دسترسی سریع عمومی</h3></div><div class="quick-grid"><div class="quick-card" onclick="openRequest()"><div class="qicon">'+svg.plus+'</div><strong>ثبت درخواست</strong><span>مرخصی، دورکاری، مأموریت و...</span></div><div class="quick-card" onclick="nav(\'inbox\')"><div class="qicon">'+svg.inbox+'</div><strong>کارتابل</strong><span>کارهای در انتظار اقدام</span></div><div class="quick-card" onclick="nav(\'attendance\')"><div class="qicon">◴</div><strong>تردد و کارکرد</strong><span>حضور و غیاب و ساعت‌زنی</span></div><div class="quick-card" onclick="nav(\'docs\')"><div class="qicon">'+svg.doc+'</div><strong>اسناد و فرم‌ها</strong><span>مشاهده و دریافت فرم‌ها</span></div></div></section></div>'+ 
      '<section class="card panel"><div class="panel-head"><h3>آخرین اطلاعیه‌ها</h3><button class="panel-link" onclick="nav(\'notifications\')">مشاهده همه</button></div>'+db.notices.map(n=>'<div class="notice"><div class="nicon">'+n[0]+'</div><div><strong>'+esc(n[1])+'</strong><span>'+esc(n[2])+'</span></div></div>').join('')+'</section>';
  };

  window.decide=function(id,status){
    const r=db.req.find(x=>x.id===id);if(!r)return;
    if(!['تأیید شده','رد شده'].includes(status)) return;
    r.status=status;r.stage='پایان فرآیند';
    pushHistory(r,status,status==='تأیید شده'?'درخواست توسط تصمیم‌گیرنده تأیید شد.':'درخواست در این مرحله رد شد.',status==='تأیید شده'?'done':'done','همین الان');
    const last=r.timeline[r.timeline.length-2];if(last)last.state='done';
    save();render();setTimeout(()=>toast(id+' '+status),40);
  };

  window.returnForCorrection=function(id){
    const r=db.req.find(x=>x.id===id);if(!r)return;
    openModal('برگشت درخواست برای اصلاح','<form class="form" onsubmit="submitReturnForCorrection(event,\''+id+'\')"><div class="field"><label for="returnReason">دلیل برگشت برای اصلاح</label><textarea id="returnReason" class="control" required placeholder="مثلاً: فایل پیوست ناقص است یا تاریخ درخواست نیاز به اصلاح دارد."></textarea></div><div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" type="submit">برگشت برای اصلاح</button></div></form>');
  };

  window.submitReturnForCorrection=function(e,id){
    e.preventDefault();
    const r=db.req.find(x=>x.id===id),reason=document.getElementById('returnReason')?.value.trim();
    if(!r||!reason)return;
    r.status='برگشت برای اصلاح';r.stage='اصلاح توسط ثبت‌کننده';r.returnReason=reason;
    pushHistory(r,'برگشت برای اصلاح',reason,'returned','همین الان');
    save();closeModal();render();setTimeout(()=>toast(id+' برای اصلاح برگشت داده شد'),40);
  };

  window.resubmitRequest=function(id){
    const r=db.req.find(x=>x.id===id);if(!r)return;
    if(r.uid!==current()?.id || !isReturned(r)) return;
    r.status='در انتظار تأیید';r.stage='تأیید مدیر';delete r.returnReason;
    ensureHistory(r);r.timeline=r.timeline.map(x=>x.state==='returned'?{...x,state:'done'}:x);
    pushHistory(r,'ارسال مجدد','درخواست پس از اصلاح دوباره برای بررسی ارسال شد.','current','همین الان');
    save();render();setTimeout(()=>toast(id+' دوباره ارسال شد'),40);
  };

  window.details=function(id){
    const r=db.req.find(x=>x.id===id),p=db.users.find(u=>u.id===r?.uid);if(!r)return;
    const canApprove=manager()&&r.status==='در انتظار تأیید';
    const canReturn=manager()&&r.status==='در انتظار تأیید';
    const canResubmit=r.uid===current()?.id&&isReturned(r);
    const timeline=ensureHistory(r);
    save();
    const steps=timeline.map((t,i)=>'<div class="request-step '+esc(t.state||'future')+'"><div class="timeline-dot">'+(t.state==='done'?'✓':(t.state==='returned'?'↻':(i+1)))+'</div><div><strong>'+esc(t.title)+'</strong><p>'+esc(t.text)+'</p></div><time>'+esc(t.date||'—')+'</time></div>').join('');
    const returnBlock=isReturned(r)?'<div class="return-note"><strong>نیاز به اصلاح</strong><p>'+esc(r.returnReason||'این درخواست برای اصلاح به ثبت‌کننده برگشت داده شده است.')+'</p></div>':'';
    openModal('جزئیات '+id,'<div class="request-detail-head"><div><div class="muted" style="font-size:8px">'+esc(r.type)+' • '+esc(r.date)+'</div><h3 style="margin:4px 0 3px;font-size:16px">'+esc(r.title)+'</h3><div class="muted" style="font-size:9px">ثبت‌کننده: '+esc(p?.name||'')+' • مرحله: '+esc(stageLabel(r))+'</div></div><div>'+badge(r.status)+'</div></div>'+returnBlock+'<div style="height:12px"></div><div class="panel" style="background:var(--surface-2);border:1px solid var(--line);border-radius:13px"><div class="panel-head"><div><h3>Timeline گردش درخواست</h3><div class="muted" style="font-size:8px;margin-top:3px">تاریخچه واقعی اقدامات این درخواست</div></div></div><div class="request-timeline">'+steps+'</div></div><div class="request-detail-actions" style="margin-top:13px">'+
      (canApprove?'<button class="btn btn-success" onclick="closeModal();decide(\''+id+'\',\'تأیید شده\')">✓ تأیید درخواست</button>':'')+
      (canReturn?'<button class="btn btn-secondary" onclick="returnForCorrection(\''+id+'\')">↩ برگشت برای اصلاح</button>':'')+
      (canApprove?'<button class="btn btn-danger" onclick="closeModal();decide(\''+id+'\',\'رد شده\')">× رد درخواست</button>':'')+
      (canResubmit?'<button class="btn btn-primary" onclick="resubmitRequest(\''+id+'\')">ارسال مجدد پس از اصلاح</button>':'')+
      '<button class="btn btn-secondary" onclick="closeModal()">بستن</button></div>');
  };

  // Ensure existing data gets workflow history lazily without changing stored appearance.
  if(Array.isArray(db.req)) db.req.forEach(ensureHistory);
  save();
})();
</script>

    'مرخصی':'منابع انسانی','دورکاری':'منابع انسانی','ماموریت اداری':'منابع انسانی','اضافه‌کاری':'منابع انسانی','گواهی اشتغال':'منابع انسانی','معرفی‌نامه اداری':'منابع انسانی','آموزش':'منابع انسانی','کارت و تردد':'منابع انسانی','اصلاح تردد':'منابع انسانی',
    'مساعده':'مالی','تنخواه':'مالی','قرارداد مالی':'مالی',

  };
  const REQUEST_PROFILES={
