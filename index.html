/* V2 Liquid Premium visual pass */
:root{
  --primary:#1977ff;--primary-2:#0e4f9f;--primary-soft:#eaf3ff;--focus:#1a82ff;
  --lime:#b9ff2d;--lime-soft:#efffc8;--electric:#62b7ff;
  --shadow:0 18px 42px rgba(21,63,119,.09);--shadow-lg:0 30px 85px rgba(15,45,90,.18)

[data-theme="dark"]{
  --primary:#6aaaff;--primary-2:#b9d7ff;--primary-soft:#142b4d;--lime:#c7ff55;--lime-soft:#26380f;--electric:#5db2ff;
  --shadow:0 20px 55px rgba(0,0,0,.25);--shadow-lg:0 34px 92px rgba(0,0,0,.38)

body{font-family:"Vazirmatn","IRANSansX","Dana","Shabnam",Tahoma,Arial,sans-serif;letter-spacing:-.05px}

}
.login{background:#071122;position:relative;overflow:hidden}
.login-showcase{position:relative;overflow:hidden;background:radial-gradient(circle at 75% 30%,rgba(25,119,255,.24),transparent 26%),linear-gradient(135deg,#071226 0%,#0d2d5f 53%,#0b6fe8 100%)}

.showcase-card{background:rgba(7,19,43,.18)!important;border-color:rgba(255,255,255,.16)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 30px rgba(0,0,0,.08)}
.showcase-card .sc-icon{background:linear-gradient(135deg,rgba(25,119,255,.8),rgba(185,255,45,.42))!important;color:#fff}
.eyebrow{background:rgba(255,255,255,.07)!important}.eyebrow:first-letter{color:var(--lime)}
.login-pane{backdrop-filter:blur(18px);box-shadow:-24px 0 70px rgba(0,0,0,.12)}
.brand-mark{background:linear-gradient(135deg,var(--primary),var(--lime));color:#0d2a18!important;box-shadow:0 14px 28px rgba(25,119,255,.22)!important}
.btn-primary{background:linear-gradient(135deg,var(--primary),#0d61d6)!important}
.btn-primary:hover{box-shadow:0 12px 26px rgba(25,119,255,.22)!important}
.btn-secondary:hover{border-color:rgba(25,119,255,.35)!important;background:var(--primary-soft)!important}
.btn-soft{background:linear-gradient(135deg,var(--primary-soft),var(--lime-soft))!important;color:var(--primary)!important}
.btn-success{background:linear-gradient(135deg,var(--success-soft),var(--lime-soft))!important}
.btn-danger{background:var(--danger-soft)!important}
.quick-card{background:linear-gradient(145deg,var(--surface),var(--surface-2))!important;border:1px solid var(--line)!important;box-shadow:0 8px 22px rgba(31,75,130,.04)}
.quick-card:hover{transform:translateY(-3px)!important;border-color:rgba(25,119,255,.28)!important;box-shadow:0 16px 34px rgba(25,119,255,.11)!important}
.quick-card .qicon{background:linear-gradient(135deg,var(--primary-soft),var(--lime-soft))!important;color:var(--primary)!important}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--surface),var(--primary-soft))!important;border-color:rgba(25,119,255,.10)!important;box-shadow:var(--shadow)!important}
.hero:before,.hero:after{content:"";position:absolute;pointer-events:none;border-radius:45% 55% 55% 45%/51% 40% 60% 49%;filter:blur(1px);opacity:.25;mix-blend-mode:multiply}
[data-theme="dark"] .hero:before,[data-theme="dark"] .hero:after{mix-blend-mode:screen;opacity:.17}
.hero:before{width:430px;height:250px;right:-95px;top:-120px;background:linear-gradient(135deg,var(--primary),var(--lime));animation:liquidDrift 13s ease-in-out infinite}
.hero:after{width:330px;height:210px;left:-80px;bottom:-110px;background:linear-gradient(135deg,var(--lime),var(--primary));animation:liquidDrift 15s ease-in-out infinite reverse}
.hero>div{position:relative;z-index:2}
.hero h2{font-size:22px;letter-spacing:-.5px}.hero p{max-width:610px}
.profile-cover{background:linear-gradient(135deg,#0b1731,#1261c4 55%,#b9ff2d)!important}
.profile-cover:before{background:linear-gradient(135deg,rgba(24,119,255,.9),rgba(185,255,45,.62))!important;filter:blur(2px)!important}
.profile-cover:after{background:linear-gradient(135deg,rgba(185,255,45,.72),rgba(24,119,255,.88))!important;filter:blur(2px)!important;animation-delay:-6s!important}
.profile-id .avatar{background:linear-gradient(135deg,#dceaff,#b9ff2d)!important}
.detail{transition:.16s}.detail:hover{transform:translateY(-2px);border-color:rgba(25,119,255,.20);box-shadow:0 10px 20px rgba(25,119,255,.06)}
.kpi{background:linear-gradient(145deg,var(--surface),var(--surface-2))!important}.progress span{background:linear-gradient(90deg,var(--primary),var(--lime))!important}
.bar{background:linear-gradient(180deg,var(--primary),var(--lime))!important}
.stat-icon{background:linear-gradient(135deg,var(--primary-soft),var(--lime-soft))!important;color:var(--primary)!important}
.nav-btn.active{background:linear-gradient(90deg,rgba(25,119,255,.96),rgba(17,74,149,.72))!important}.nav-btn.active:before{background:var(--lime)!important}
/* security code */
.otp-box{margin-top:13px;padding:12px 13px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,var(--surface-2),var(--surface));box-shadow:0 8px 18px rgba(25,119,255,.04)}
.otp-line{display:flex;align-items:center;gap:8px}.otp-code{flex:1;font-size:22px;font-weight:950;letter-spacing:6px;color:var(--primary);direction:ltr;text-align:center;background:linear-gradient(90deg,var(--primary),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}.otp-refresh{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--primary)}.otp-refresh:hover{background:var(--primary-soft);border-color:rgba(25,119,255,.28)}.otp-meta{font-size:8px;color:var(--muted);margin-top:5px;text-align:center}.security-note{font-size:8px;color:var(--muted);line-height:1.8;margin-top:10px}
@keyframes liquidDrift{0%,100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}33%{transform:translate3d(24px,18px,0) rotate(6deg) scale(1.04)}66%{transform:translate3d(-18px,28px,0) rotate(-7deg) scale(1.08)}}

const KEY='companyPortalPremiumV2';const SESSION='companyPortalPremiumSession';
function load(){const r=localStorage.getItem(KEY);if(r){try{return JSON.parse(r)}catch(e){}}localStorage.setItem(KEY,JSON.stringify(seed));return JSON.parse(JSON.stringify(seed))}
let db=load();let session=JSON.parse(localStorage.getItem(SESSION)||'null');let page='dashboard';let modalFocus=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function current(){return session?db.users.find(x=>x.id===session.id):null}function manager(){return current()&&['manager','admin'].includes(current().u)}function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function badge(s){const map={'تأیید شده':'green','در انتظار تأیید':'yellow','در حال بررسی':'blue','رد شده':'red','نیازمند اقدام':'yellow','انجام شده':'green','فعال':'green'};return '<span class="badge '+(map[s]||'gray')+'">'+esc(s)+'</span>'}
function theme(){const t=localStorage.getItem('companyTheme')||'light';document.documentElement.dataset.theme=t;return t}
function toggleTheme(){const t=theme()==='dark'?'light':'dark';localStorage.setItem('companyTheme',t);theme();render();toast(t==='dark'?'حالت تیره فعال شد':'حالت روشن فعال شد')}
function toast(t){const el=document.querySelector('.toast');if(!el)return;el.textContent=t;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2100)}
function nav(p){page=p;document.querySelector('.profile-menu')?.classList.remove('open');render();setTimeout(()=>document.getElementById('main-content')?.focus(),20)}
let loginOtp=""; let otpExpires=Date.now()+90000;
function refreshOtp(){loginOtp=String(Math.floor(100000+Math.random()*900000));otpExpires=Date.now()+90000;const c=document.getElementById('otpCode'),m=document.getElementById('otpMeta');if(c)c.textContent=loginOtp;if(m)updateOtpTimer(m)}
function updateOtpTimer(el){clearInterval(window.__otp);const tick=()=>{const s=Math.max(0,Math.ceil((otpExpires-Date.now())/1000));el.textContent=s?('اعتبار کد: '+s+' ثانیه'):'کد منقضی شد — کد جدید بسازید';if(s===0)clearInterval(window.__otp)};tick();window.__otp=setInterval(tick,1000)}
function login(){const u=document.getElementById('lu')?.value.trim(),p=document.getElementById('lp')?.value,code=document.getElementById('loginOtp')?.value.trim(),found=db.users.find(x=>x.u===u&&x.p===p);if(Date.now()>otpExpires){document.getElementById('loginError').textContent='کد امنیتی منقضی شده؛ یک کد جدید بسازید.';return}if(code!==loginOtp){document.getElementById('loginError').textContent='کد امنیتی صحیح نیست.';document.getElementById('loginOtp').focus();return}if(!found){document.getElementById('loginError').textContent='نام کاربری یا رمز عبور صحیح نیست.';document.getElementById('lp').focus();return}session={id:found.id};localStorage.setItem(SESSION,JSON.stringify(session));page='dashboard';render()}
function logout(){session=null;localStorage.removeItem(SESSION);page='dashboard';render()}
function openProfileMenu(){document.querySelector('.profile-menu')?.classList.toggle('open')}
function closeModal(){const m=document.getElementById('modal');if(m){m.classList.remove('show');m.innerHTML=''}modalFocus?.focus?.()}
function openModal(title,body){modalFocus=document.activeElement;const m=document.getElementById('modal');m.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">'+title+'</h3><button class="close" aria-label="بستن" title="بستن" onclick="closeModal()">'+svg.close+'</button></div>'+body+'</div>';m.classList.add('show');setTimeout(()=>m.querySelector('input,select,textarea,button')?.focus(),30)}
function openRequest(){openModal('ثبت درخواست جدید','<form class="form" onsubmit="submitRequest(event)"><div class="formgrid"><div class="field"><label for="rt">نوع درخواست</label><select id="rt" class="control"><option>مرخصی</option><option>دورکاری</option><option>ماموریت</option><option>خرید</option><option>پاسخ استعلام</option><option>قرارداد مالی</option><option>تحصیل دارایی</option><option>ابطال دارایی</option></select></div><div class="field"><label for="rtitle">عنوان درخواست</label><input id="rtitle" class="control" required></div><div class="field full"><label for="rd">شرح درخواست</label><textarea id="rd" class="control" required placeholder="موضوع را روشن و دقیق بنویسید"></textarea></div></div><div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">انصراف</button><button class="btn btn-primary" type="submit">ثبت درخواست</button></div></form>')}

function decide(id,status){const r=db.req.find(x=>x.id===id);if(!r)return;r.status=status;r.stage='پایان فرآیند';save();render();setTimeout(()=>toast(id+' '+status),40)}

function docs(){const arr=['فرم درخواست مرخصی','فرم درخواست دورکاری','فرم ماموریت اداری','فرم پاسخ استعلام','فرم قرارداد مالی','فرم تحصیل دارایی','فرم ابطال دارایی','فرم خروج کالا'];return '<section class="card panel"><div class="panel-head"><h3>اسناد و فرم‌ها</h3><button class="btn btn-secondary" onclick="toast(\'جستجوی اسناد فعال شد\')">'+svg.search+' جستجو</button></div><div class="quick-grid">'+arr.map(x=>'<div class="quick-card" onclick="toast(\''+x+' برای مشاهده و دانلود آماده است\')"><div class="qicon">'+svg.doc+'</div><strong>'+x+'</strong><span>مشاهده، چاپ یا دانلود</span></div>').join('')+'</div></section>'}
function notifications(){return '<section class="card panel"><div class="panel-head"><h3>اعلان‌ها</h3><button class="btn btn-secondary" onclick="toast(\'همه اعلان‌ها خوانده‌شده علامت خوردند\')">علامت‌گذاری همه</button></div>'+db.notices.map(n=>'<div class="notice"><div class="nicon">'+n[0]+'</div><div><strong>'+esc(n[1])+'</strong><span>'+esc(n[2])+'</span></div></div>').join('')+'</section>'}
function profile(){const u=current();return `<section class="card" style="overflow:hidden"><div class="profile-cover"></div><div class="profile-main"><div class="profile-id"><div class="avatar">${esc(u.avatar)}</div><div class="profile-title"><h2>${esc(u.name)}</h2><p>${esc(u.role)} • ${esc(u.unit)}</p></div><div class="profile-actions"><button class="btn btn-secondary" onclick="toast('ویرایش اطلاعات در نسخه عملیاتی فعال می‌شود')">ویرایش اطلاعات</button><button class="btn btn-soft" onclick="toggleTheme()">${theme()==='dark'?svg.sun:svg.moon} ${theme()==='dark'?'حالت روشن':'حالت تیره'}</button></div></div><div class="detail-grid"><div class="detail"><small>شماره پرسنلی</small><strong>${esc(u.employeeId)}</strong></div><div class="detail"><small>سمت سازمانی</small><strong>${esc(u.role)}</strong></div><div class="detail"><small>واحد سازمانی</small><strong>${esc(u.unit)}</strong></div><div class="detail"><small>مدیر مستقیم</small><strong>${esc(u.manager)}</strong></div><div class="detail"><small>شماره تماس</small><strong>${esc(u.phone)}</strong></div><div class="detail"><small>ایمیل سازمانی</small><strong>${esc(u.email)}</strong></div><div class="detail"><small>محل خدمت</small><strong>${esc(u.location)}</strong></div><div class="detail"><small>تاریخ استخدام</small><strong>${esc(u.join)}</strong></div><div class="detail"><small>آخرین ورود</small><strong>${esc(u.lastLogin)}</strong></div><div class="detail"><small>وضعیت حساب</small><strong>${badge('فعال')}</strong></div><div class="detail"><small>سطح دسترسی</small><strong>${esc(manager()?'مدیریتی':'کاربری')}</strong></div><div class="detail"><small>امنیت حساب</small><strong style="color:var(--success)">احراز هویت دومرحله‌ای فعال</strong></div></div></div></section><div class="grid2"><section class="card panel"><div class="panel-head"><h3>فعالیت‌های اخیر</h3><span class="muted" style="font-size:9px">آخرین رویدادها</span></div><div class="timeline">${db.activities.map(a=>`<div class="timeline-item"><div class="timeline-dot">${a[3]}</div><div><strong>${esc(a[0])}</strong><p>${esc(a[1])}</p></div><time>${esc(a[2])}</time></div>`).join('')}</div></section><section class="card panel"><div class="panel-head"><h3>خلاصه عملکرد</h3></div><div class="kpis"><div class="kpi"><small>مرخصی باقی‌مانده</small><strong>۱۸</strong><div class="progress"><span style="width:72%"></span></div></div><div class="kpi"><small>درخواست‌های باز</small><strong>${db.req.filter(r=>r.uid===u.id&&r.status==='در انتظار تأیید').length}</strong><div class="progress"><span style="width:38%"></span></div></div><div class="kpi"><small>روزهای حضور این ماه</small><strong>۱۹</strong><div class="progress"><span style="width:86%"></span></div></div></div></section></div>`}
function settings(){const t=theme();return '<section class="card panel"><div class="panel-head"><h3>تنظیمات تجربه کاربری</h3><span class="badge gray">محلی روی این مرورگر</span></div><div class="formgrid"><div class="field"><label for="themeSelect">حالت نمایش</label><select id="themeSelect" class="control" onchange="localStorage.setItem(\'companyTheme\',this.value);theme();render()"><option value="light" '+(t==='light'?'selected':'')+'>روشن</option><option value="dark" '+(t==='dark'?'selected':'')+'>تیره</option></select></div><div class="field"><label for="density">تراکم نمایش</label><select id="density" class="control"><option>متعادل</option><option>فشرده</option></select></div></div><div class="modal-actions"><button class="btn btn-primary" onclick="toast(\'تنظیمات ذخیره شد\')">ذخیره تنظیمات</button><button class="btn btn-secondary" onclick="document.body.classList.toggle(\'high-contrast\');toast(\'نمای کنتراست بالا فعال شد\')">کنتراست بالا</button></div></section>'}
function content(){switch(page){case'inbox':return inbox();case'requests':return requests();case' approvals':return approvals();case'approvals':return approvals();case'people':return people();case'processes':return processes();case'reports':return reports();case'docs':return docs();case'notifications':return notifications();case'profile':return profile();case'settings':return settings();default:return dashboard()}}
function shell(){return '<div class="app">'+sidebar()+'<main id="main-content" class="main" tabindex="-1">'+topbar()+'<div class="breadcrumb"><span>سامانه</span><span>/</span><span aria-current="page">'+pageTitle().h+'</span></div><div class="content">'+content()+'</div><div id="modal" class="modal-backdrop"></div><div class="toast"></div></main></div>'}
function bindOutside(){document.addEventListener('click',e=>{const menu=document.querySelector('.profile-menu'),tr=e.target.closest('.profile-trigger');if(menu&&!tr&&!e.target.closest('.profile-menu'))menu.classList.remove('open')},{once:true});document.getElementById('modal')?.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})}
function render(){theme();document.getElementById('app').innerHTML=session&&current()?shell():loginView();bindOutside()}
render();
</script>
</body>
</html>
