<style>
:root{--bg:#f4f7fb;--surface:#fff;--surface2:#f7f9fc;--text:#172033;--muted:#6b778c;--line:#e2e9f2;--primary:#1977ff;--primary2:#0e4f9f;--soft:#eaf3ff;--good:#168a4a;--goodsoft:#e9f7ef;--warn:#a96500;--warnsoft:#fff4dc;--bad:#c93333;--badsoft:#ffefef;--side:#0b1730;--side2:#12365f;--r:16px;--shadow:0 14px 36px rgba(20,55,100,.08)}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px}.muted{color:var(--muted)}
.login{min-height:100vh;display:grid;grid-template-columns:1.12fr .88fr;background:linear-gradient(135deg,#071226,#173b7a 55%,#1977ff);overflow:hidden}.showcase{padding:7vw;display:flex;align-items:center;color:#fff;position:relative}.showcase:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;right:-170px;top:-180px;background:linear-gradient(135deg,rgba(25,119,255,.8),rgba(185,255,45,.35));filter:blur(4px)}.showcase>*{position:relative;z-index:1}.eyebrow{display:inline-flex;padding:7px 11px;border:1px solid #ffffff28;background:#ffffff12;border-radius:999px;font-size:11px}.showcase h1{font-size:clamp(32px,4vw,52px);line-height:1.25;margin:22px 0 12px}.showcase p{max-width:650px;color:#ffffffc9;font-size:14px}.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:28px}.feature{padding:15px;border:1px solid #ffffff1e;background:#ffffff0c;border-radius:15px;backdrop-filter:blur(8px)}.feature b{display:block;font-size:12px}.feature span{font-size:9px;color:#ffffffa5}.login-pane{background:var(--surface);border-radius:36px 0 0 36px;display:grid;place-items:center;padding:30px}.login-card{width:min(450px,100%)}.brand{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,var(--primary),#8f72ff);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900}.login-card h2{font-size:29px;margin:18px 0 3px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.control{width:100%;min-height:47px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:9px 12px}.otp{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}.otp strong{flex:1;text-align:center;font-size:22px;letter-spacing:5px;color:var(--primary)}.otp button{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}.btn{min-height:44px;border:1px solid transparent;border-radius:12px;padding:8px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:800;transition:.16s}.btn:hover{transform:translateY(-1px)}.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}.secondary{background:var(--surface);color:var(--text);border-color:var(--line)}.soft{background:var(--soft);color:var(--primary)}.danger{background:var(--badsoft);color:var(--bad)}.success{background:var(--goodsoft);color:var(--good)}.block{width:100%}.demo{margin-top:16px;padding:12px;border:1px dashed var(--line);border-radius:13px;background:var(--surface2);font-size:10px}.error{min-height:20px;color:var(--bad);font-size:11px}
.app{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.sidebar{background:linear-gradient(180deg,var(--side),var(--side2));color:#fff;padding:16px 13px;display:flex;flex-direction:column}.side-brand{display:flex;gap:10px;align-items:center;padding:5px 8px 16px;border-bottom:1px solid #ffffff12}.side-mark{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,var(--primary),#8f72ff);display:grid;place-items:center;font-weight:900}.side-brand b{font-size:12px}.side-brand small{display:block;color:#ffffff88;font-size:9px}.nav{margin-top:15px}.nav-label{color:#ffffff6e;font-size:9px;padding:0 9px 6px}.nav button{width:100%;border:0;background:transparent;color:#dce8f8;border-radius:11px;padding:10px;text-align:right;margin:3px 0;font-size:11px}.nav button:hover{background:#ffffff0c}.nav button.active{background:linear-gradient(90deg,#1977ffdd,#174d9b99)}.side-user{margin-top:auto;padding-top:12px;border-top:1px solid #ffffff12;font-size:9px}.side-user strong{display:block;font-size:10px}.logout{margin-top:9px;width:100%;background:#ffffff0a;color:#fff;border:1px solid #ffffff12;border-radius:10px;padding:9px}
.main{padding:20px 24px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:20;padding:8px 0 13px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}.topbar h1{margin:0;font-size:24px}.topbar p{margin:2px 0 0;color:var(--muted);font-size:10px}.actions{display:flex;gap:7px;align-items:center}.iconbtn{width:42px;height:42px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:11px}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#dceaff,#fff);color:#1d4ed8;display:grid;place-items:center;font-weight:900}.profile-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:4px 7px}.content{display:grid;gap:15px}.hero{padding:20px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(135deg,var(--surface),var(--soft));box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:15px;align-items:center}.hero h2{margin:0;font-size:20px}.hero p{margin:5px 0 0;color:var(--muted);font-size:10px}.hero-actions{display:flex;gap:7px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.stat{padding:15px}.stat small{color:var(--muted);font-size:10px}.stat strong{display:block;font-size:28px;margin:6px 0}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.panel{padding:17px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.head h3{margin:0;font-size:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);font-size:9px}th{background:var(--surface2);color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:8px;font-weight:800}.blue{background:var(--soft);color:var(--primary)}.green{background:var(--goodsoft);color:var(--good)}.yellow{background:var(--warnsoft);color:var(--warn)}.red{background:var(--badsoft);color:var(--bad)}.gray{background:var(--surface2);color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick button{min-height:100px;text-align:right;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:13px;padding:12px}.quick button:hover{border-color:var(--primary)}.quick b{display:block;font-size:10px}.quick span{font-size:8px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters .control{width:auto;min-width:150px;min-height:40px;font-size:10px}.process-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.process{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}.process h4{margin:8px 0 4px;font-size:11px}.process p{font-size:8px;color:var(--muted);margin:0;line-height:1.9}.modal-bg{position:fixed;inset:0;background:#030a1875;display:none;place-items:center;padding:18px;z-index:100}.modal-bg.show{display:grid}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 30px 90px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{font-size:14px}.close{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.modal-actions{display:flex;gap:7px;margin-top:13px}.timeline{display:grid;gap:9px}.step{display:grid;grid-template-columns:28px 1fr auto;gap:8px}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--primary);font-size:9px;font-weight:900}.step strong{font-size:10px}.step p{margin:2px 0;color:var(--muted);font-size:8px}.step time{font-size:8px;color:var(--muted)}.toast{position:fixed;left:20px;bottom:20px;background:#101827;color:#fff;padding:10px 13px;border-radius:11px;font-size:9px;opacity:0;transform:translateY(8px);transition:.2s;z-index:150}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.app{grid-template-columns:84px}.side-brand span,.side-brand small,.nav-label,.nav button span,.side-user{display:none}.side-brand{justify-content:center}.nav button{text-align:center}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.login{display:block}.showcase{display:none}.login-pane{min-height:100vh;border-radius:0;padding:22px 16px}.app{display:block}.sidebar{position:fixed;left:0;right:0;bottom:0;height:68px;z-index:80;padding:5px 7px}.side-brand,.side-user{display:none}.nav{display:flex;overflow:auto;margin:0;gap:3px}.nav button{min-width:62px;height:57px;margin:0;text-align:center;padding:5px}.nav button span{display:block!important;font-size:8px}.nav-label{display:none}.main{padding:12px 10px 86px}.topbar{align-items:flex-start}.topbar h1{font-size:19px}.topbar p{font-size:9px}.top-actions .profile-btn span{display:none}.hero{display:block;padding:15px}.hero-actions{margin-top:11px;display:grid;grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr;gap:8px}.grid2,.process-grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.table-wrap{overflow:visible}table{min-width:0}thead{display:none}tbody{display:grid;gap:8px}tr{display:block;border:1px solid var(--line);border-radius:13px;padding:5px 10px}td{display:flex;justify-content:space-between;gap:8px;border:0;border-bottom:1px dashed var(--line);font-size:9px}td:last-child{border:0}td:before{content:attr(data-label);color:var(--muted);font-weight:800}.table-wrap td>*{max-width:65%}.modal-actions{display:grid;grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.btn:hover{transform:none}}
</style>

<body>
<div id="root"></div>
<div id="modal" class="modal-bg"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const users=[
{id:1,u:'employee',p:'1234',name:'پارسا احمدی',role:'کارمند',unit:'بازرگانی',avatar:'پ',manager:'مریم رضایی',employeeId:'PS-1027'},
{id:2,u:'manager',p:'1234',name:'مریم رضایی',role:'مدیر بازرگانی',unit:'مدیریت بازرگانی',avatar:'م',manager:'مدیرعامل',employeeId:'MG-1004'},
{id:3,u:'admin',p:'1234',name:'مدیر سیستم',role:'مدیر سامانه',unit:'فناوری اطلاعات',avatar:'س',manager:'مدیرعامل',employeeId:'IT-0001'}
];
let db=JSON.parse(localStorage.getItem('companyV27')||'null')||{
requests:[
{id:'REQ-1042',type:'مرخصی',title:'درخواست مرخصی',uid:1,date:'۱۴۰۵/۰۷/۰۲',stage:'تأیید مدیر',status:'در انتظار تأیید'},
{id:'REQ-1039',type:'دورکاری',title:'درخواست دورکاری',uid:1,date:'۱۴۰۵/۰۷/۰۱',stage:'پایان فرآیند',status:'تأیید شده'},
{id:'REQ-1035',type:'خرید تجهیزات',title:'درخواست خرید تجهیزات',uid:1,date:'۱۴۰۵/۰۶/۳۱',stage:'بررسی مالی',status:'در حال بررسی'}
],activity:[]};
let session=JSON.parse(sessionStorage.getItem('companyV27Session')||localStorage.getItem('companyV27Session')||'null'),page='dashboard',otp='';
const reqTypes=['مرخصی','دورکاری','ماموریت','اضافه‌کاری','مساعده','تنخواه','خرید تجهیزات','پشتیبانی فناوری اطلاعات','دسترسی سامانه','پاسخ استعلام','قرارداد مالی','تحصیل دارایی','ابطال دارایی','خروج کالا'];
const processes=[
['درخواست مرخصی','ثبت درخواست → بررسی مدیر → ثبت نتیجه','منابع انسانی'],
['دورکاری','ثبت بازه → بررسی مدیر → اعلام نتیجه','منابع انسانی'],
['پاسخ استعلام','ثبت → بررسی کارشناس → تأیید مسئول → ارسال','بازرگانی'],
['قرارداد مالی','بررسی بازرگانی → برنامه‌ریزی → پیش‌نویس → ثبت → تأییدهای مالی/حقوقی','مالی/حقوقی'],
['خروج کالا از انبار','ثبت اقلام → برنامه‌ریزی → کنترل موجودی → خروج','انبار'],
['تحصیل دارایی','ثبت → مسئول دارایی ثابت → مدیرعامل → ثبت نهایی','اموال'],
['ابطال دارایی','درخواست مدیر → مدیرعامل → بررسی انبار → نهایی‌سازی','اموال/انبار']
];
function save(){localStorage.setItem('companyV27',JSON.stringify(db))}
function user(){return users.find(x=>x.id===session?.id)}
function manager(){return ['manager','admin'].includes(user()?.u)}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}
function badge(s){let c={'تأیید شده':'green','در انتظار تأیید':'yellow','در حال بررسی':'blue','رد شده':'red','نیازمند اقدام':'yellow'}[s]||'gray';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}
function theme(){let t=localStorage.getItem('companyV27Theme')||'light';document.documentElement.dataset.theme=t;return t}
function toggleTheme(){localStorage.setItem('companyV27Theme',theme()==='dark'?'light':'dark');render()}
function newOtp(){otp=String(Math.floor(100000+Math.random()*900000));document.getElementById('otp').textContent=otp}
function login(e){e.preventDefault();let u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value,c=document.getElementById('lc').value.trim(),x=users.find(x=>x.u===u&&x.p===p);if(c!==otp){document.getElementById('err').textContent='کد امنیتی صحیح نیست.';return}if(!x){document.getElementById('err').textContent='نام کاربری یا رمز عبور صحیح نیست.';return}session={id:x.id};sessionStorage.setItem('companyV27Session',JSON.stringify(session));if(document.getElementById('remember').checked)localStorage.setItem('companyV27Session',JSON.stringify(session));db.activity.unshift(['ورود موفق به سامانه','نشست کاربری جدید ایجاد شد','همین الان']);save();render()}
function logout(){session=null;sessionStorage.removeItem('companyV27Session');localStorage.removeItem('companyV27Session');render()}
function loginView(){newOtp();return `<div class="login"><section class="showcase"><div><span class="eyebrow">نسخه ۲۷ · Corporate Portal</span><h1>سامانه جامع مدیریت امور شرکت</h1><p>یک رابط سازمانی یکپارچه برای کارتابل، درخواست‌ها، تردد، فرآیندها، تأییدها و اطلاعات پرسنلی.</p><div class="feature-grid"><div class="feature"><b>کارتابل و تأییدها</b><span>تمرکز روی کارهای نیازمند اقدام و مسیر تصمیم.</span></div><div class="feature"><b>فرآیندهای سازمانی</b><span>گردش‌های قابل مشاهده از ثبت تا پایان.</span></div><div class="feature"><b>تجربه واکنش‌گرا</b><span>قابل استفاده در دسکتاپ، تبلت و موبایل.</span></div><div class="feature"><b>دسترسی‌پذیری</b><span>فوکوس واضح، کاهش حرکت و ساختار خوانا.</span></div></div></div></section><section class="login-pane"><div class="login-card"><div class="brand">ش</div><h2>ورود به سامانه</h2><div class="muted" style="font-size:11px">سامانه سازمانی شرکت · نسخه ۲۷</div><form onsubmit="login(event)" autocomplete="on"><div class="field"><label for="lu">نام کاربری</label><input id="lu" class="control" autocomplete="username" required placeholder="نام کاربری"></div><div class="field"><label for="lp">رمز عبور</label><input id="lp" class="control" type="password" autocomplete="current-password" required placeholder="رمز عبور"></div><div class="field"><label>کد امنیتی</label><div class="otp"><strong id="otp">${otp}</strong><button type="button" onclick="newOtp()" aria-label="کد جدید">↻</button></div><input id="lc" class="control" style="margin-top:8px" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required placeholder="کد شش رقمی"></div><label style="font-size:10px"><input id="remember" type="checkbox"> مرا به خاطر بسپار</label><button class="btn primary block" style="margin-top:12px">ورود امن</button><div id="err" class="error"></div></form><div class="demo"><b>حساب‌های دمو</b><br>کارمند: <b>employee / 1234</b><br>مدیر: <b>manager / 1234</b><br>مدیر سیستم: <b>admin / 1234</b></div></div></section></div>`}
function nav(p){page=p;render()}
function shell(){
const u=user();const titles={dashboard:['داشبورد','نمای کلی وضعیت و فعالیت‌ها'],inbox:['کارتابل من','موارد ارجاع‌شده و نیازمند اقدام'],requests:['درخواست‌ها','ثبت و پیگیری خدمات سازمانی'],attendance:['تردد و کارکرد','حضور، ساعت‌زنی و خلاصه کارکرد'],approvals:['تأییدها','تصمیم‌گیری روی درخواست‌های نیازمند تأیید'],people:['پرسنل','اطلاعات کارکنان و ساختار سازمانی'],processes:['فرآیندها','گردش کار فرآیندهای سازمانی'],reports:['گزارشات','شاخص‌ها و آمار عملیاتی'],profile:['حساب من','پروفایل و اطلاعات سازمانی'],settings:['تنظیمات','شخصی‌سازی تجربه کاربری']};let t=titles[page]||titles.dashboard;
let navs=[['dashboard','داشبورد'],['inbox','کارتابل من'],['requests','درخواست‌ها'],['attendance','تردد و کارکرد']];if(manager())navs.push(['approvals','تأییدها'],['people','پرسنل'],['processes','فرآیندها'],['reports','گزارشات']);navs.push(['profile','حساب من'],['settings','تنظیمات']);
return `<div class="app"><aside class="sidebar"><div class="side-brand"><div class="side-mark">ش</div><div><b>سامانه جامع سازمانی</b><small>پرتال داخلی شرکت</small></div></div><nav class="nav"><div class="nav-label">منوی اصلی</div>${navs.map(n=>`<button class="${page===n[0]?'active':''}" onclick="nav('${n[0]}')"><span>◈</span> ${n[1]}</button>`).join('')}</nav><div class="side-user"><strong>${esc(u.name)}</strong>${esc(u.role)}<button class="logout" onclick="logout()">خروج از حساب</button></div></aside><main class="main"><header class="topbar"><div><h1>${t[0]}</h1><p>${t[1]}</p></div><div class="actions"><button class="iconbtn" onclick="toggleTheme()" aria-label="تغییر تم">${theme()==='dark'?'☀':'☾'}</button><div class="profile-btn"><span>${esc(u.name)}</span><span class="avatar">${esc(u.avatar)}</span></div></div></header><div class="content">${content()}</div></main></div>`}
function dashboard(){
let open=manager()?db.requests.filter(r=>r.status==='در انتظار تأیید').length:db.requests.filter(r=>r.uid===user().id&&r.status==='در انتظار تأیید').length;
return `<section class="hero"><div><h2>سلام ${esc(user().name.split(' ')[0])} 👋</h2><p>${open} مورد برای پیگیری یا اقدام در اختیار شماست.</p></div><div class="hero-actions"><button class="btn primary" onclick="openRequest()">＋ ثبت درخواست</button><button class="btn secondary" onclick="nav('inbox')">کارتابل</button></div></section><div class="cards"><div class="card stat"><small>کارتابل باز</small><strong>${open}</strong><span class="badge yellow">نیازمند اقدام</span></div><div class="card stat"><small>درخواست‌های من</small><strong>${db.requests.filter(r=>r.uid===user().id).length}</strong><span class="badge green">ثبت شده</span></div><div class="card stat"><small>مرخصی باقی‌مانده</small><strong>۱۸</strong><span class="muted" style="font-size:9px">روز کاری</span></div><div class="card stat"><small>اعلان جدید</small><strong>۴</strong><span class="badge blue">امروز</span></div></div><div class="grid2"><section class="card panel"><div class="head"><h3>آخرین درخواست‌ها</h3><button class="btn soft" onclick="nav('requests')">مشاهده همه</button></div><div class="table-wrap"><table><thead><tr><th>شناسه</th><th>موضوع</th><th>تاریخ</th><th>وضعیت</th></tr></thead><tbody>${db.requests.slice(0,5).map(r=>`<tr><td>${r.id}</td><td>${esc(r.title)}</td><td>${r.date}</td><td>${badge(r.status)}</td></tr>`).join('')}</tbody></table></div></section><section class="card panel"><div class="head"><h3>دسترسی سریع</h3></div><div class="quick"><button onclick="openRequest('مرخصی')"><b>مرخصی</b><span>ثبت مرخصی روزانه یا ساعتی</span></button><button onclick="openRequest('دورکاری')"><b>دورکاری</b><span>ثبت بازه دورکاری</span></button><button onclick="openRequest('خروج کالا')"><b>خروج کالا</b><span>ثبت درخواست خروج از انبار</span></button><button onclick="openRequest('تحصیل دارایی')"><b>تحصیل دارایی</b><span>شروع گردش دارایی</span></button></div></section></div>`}
function requests(){let rows=db.requests.filter(r=>manager()||r.uid===user().id);return `<section class="card panel"><div class="head"><div><h3>درخواست‌ها</h3><span class="muted" style="font-size:8px">خدمات منابع انسانی، مالی، انبار، اموال و اداری</span></div><button class="btn primary" onclick="openRequest()">＋ درخواست جدید</button></div><div class="filters"><select class="control"><option>همه انواع</option>${reqTypes.map(x=>`<option>${x}</option>`).join('')}</select><select class="control"><option>همه وضعیت‌ها</option><option>در انتظار تأیید</option><option>تأیید شده</option><option>در حال بررسی</option><option>رد شده</option></select></div><div class="table-wrap"><table><thead><tr><th>شناسه</th><th>نوع</th><th>عنوان</th><th>تاریخ</th><th>مرحله</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.id}</td><td>${esc(r.type)}</td><td>${esc(r.title)}</td><td>${r.date}</td><td>${esc(r.stage)}</td><td>${badge(r.status)}</td><td><button class="btn soft" onclick="details('${r.id}')">جزئیات</button></td></tr>`).join('')}</tbody></table></div></section>`}
function inbox(){let rows=db.requests.filter(r=>r.status==='در انتظار تأیید'&&(manager()||r.uid===user().id));return `<section class="card panel"><div class="head"><h3>کارتابل من</h3>${badge('نیازمند اقدام')}</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>شناسه</th><th>شرح</th><th>موعد</th><th>عملیات</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.id}</td><td>${esc(r.title)}</td><td>امروز</td><td><button class="btn soft" onclick="details('${r.id}')">بررسی</button></td></tr>`).join('')}</tbody></table></div>`:`<div style="text-align:center;padding:35px;color:var(--muted)">در حال حاضر موردی برای اقدام ندارید.</div>`}</section>`}
function approvals(){if(!manager())return '';let rows=db.requests.filter(r=>r.status==='در انتظار تأیید');return `<section class="card panel"><div class="head"><h3>درخواست‌های نیازمند تأیید</h3>${badge('نیازمند اقدام')}</div><div class="table-wrap"><table><thead><tr><th>شناسه</th><th>ثبت‌کننده</th><th>موضوع</th><th>عملیات</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.id}</td><td>${esc(users.find(x=>x.id===r.uid)?.name||'')}</td><td>${esc(r.title)}</td><td><button class="btn success" onclick="decide('${r.id}','تأیید شده')">تأیید</button> <button class="btn danger" onclick="decide('${r.id}','رد شده')">رد</button></td></tr>`).join('')}</tbody></table></div></section>`}
function attendance(){return `<section class="card panel"><div class="head"><h3>تردد و کارکرد</h3><span class="badge blue">دمو</span></div><div class="hero"><div><h2>ثبت تردد امروز</h2><p>در نسخه عملیاتی، این بخش به سرویس تردد و شیفت متصل می‌شود.</p></div><div class="hero-actions"><button class="btn primary" onclick="toast('ورود ثبت شد')">ثبت ورود</button><button class="btn secondary" onclick="toast('خروج ثبت شد')">ثبت خروج</button></div></div></section><div class="cards"><div class="card stat"><small>روزهای حضور</small><strong>۱۹</strong></div><div class="card stat"><small>تأخیر</small><strong>۲</strong></div><div class="card stat"><small>کارکرد</small><strong>۱۵۲</strong></div><div class="card stat"><small>مرخصی</small><strong>۱</strong></div></div>`}
function people(){return `<section class="card panel"><div class="head"><h3>پرسنل</h3><button class="btn primary" onclick="toast('فرم ایجاد کاربر در نسخه عملیاتی متصل می‌شود')">＋ کاربر جدید</button></div><div class="table-wrap"><table><thead><tr><th>نام</th><th>شماره پرسنلی</th><th>واحد</th><th>سمت</th><th>مدیر</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.employeeId}</td><td>${esc(u.unit)}</td><td>${esc(u.role)}</td><td>${esc(u.manager)}</td></tr>`).join('')}</tbody></table></div></section>`}
function processes(){return `<div class="cards"><div class="card stat"><small>فرآیندهای اصلی</small><strong>${processes.length}</strong></div><div class="card stat"><small>گردش‌های چندمرحله‌ای</small><strong>۴</strong></div><div class="card stat"><small>کنترل مدیریتی</small><strong>۷</strong></div><div class="card stat"><small>نسخه فرانت</small><strong>۲۷</strong></div></div><section class="card panel"><div class="head"><h3>فرآیندهای سازمانی</h3></div><div class="process-grid">${processes.map((p,i)=>`<article class="process"><span class="badge blue">${esc(p[2])}</span><h4>${esc(p[0])}</h4><p>${esc(p[1])}</p><button class="btn soft" style="margin-top:9px" onclick="processDetails(${i})">مشاهده گردش</button></article>`).join('')}</div></section>`}
function reports(){return `<div class="cards"><div class="card stat"><small>کل درخواست‌ها</small><strong>۱۲۸</strong></div><div class="card stat"><small>تکمیل‌شده</small><strong>۹۶</strong></div><div class="card stat"><small>در انتظار</small><strong>۲۱</strong></div><div class="card stat"><small>رد شده</small><strong>۱۱</strong></div></div><section class="card panel"><div class="head"><h3>گزارشات</h3><button class="btn secondary" onclick="toast('خروجی Excel/PDF در نسخه عملیاتی متصل می‌شود')">خروجی</button></div><p class="muted" style="font-size:10px">شاخص‌ها و نمودارهای واقعی باید از سرویس گزارشات/داده عملیاتی تغذیه شوند؛ اعداد این صفحه نمونه هستند.</p></section>`}
function profile(){let u=user();return `<section class="card panel"><div class="head"><h3>پروفایل سازمانی</h3><button class="btn secondary" onclick="toast('ویرایش پروفایل در نسخه عملیاتی متصل می‌شود')">ویرایش</button></div><div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="card stat"><small>نام</small><strong style="font-size:17px">${esc(u.name)}</strong></div><div class="card stat"><small>شماره پرسنلی</small><strong style="font-size:17px">${u.employeeId}</strong></div><div class="card stat"><small>واحد</small><strong style="font-size:17px">${esc(u.unit)}</strong></div></div></section>`}
function settings(){return `<section class="card panel"><div class="head"><h3>تنظیمات تجربه کاربری</h3></div><div class="formgrid"><div class="field"><label>حالت نمایش</label><select class="control" onchange="localStorage.setItem('companyV27Theme',this.value);render()"><option value="light" ${theme()==='light'?'selected':''}>روشن</option><option value="dark" ${theme()==='dark'?'selected':''}>تیره</option></select></div><div class="field"><label>حرکت رابط</label><button class="control" onclick="document.documentElement.classList.toggle('reduce');toast('تنظیم حرکت تغییر کرد')">کاهش انیمیشن</button></div></div><p class="muted" style="font-size:9px">تنظیمات نمایشی این نسخه در مرورگر ذخیره می‌شوند.</p></section>`}
function content(){switch(page){case'inbox':return inbox();case'requests':return requests();case'attendance':return attendance();case'approvals':return approvals();case'people':return people();case'processes':return processes();case'reports':return reports();case'profile':return profile();case'settings':return settings();default:return dashboard()}}
function openModal(title,body){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div>${body}</div>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openRequest(pre='مرخصی'){openModal('ثبت درخواست جدید',`<form onsubmit="submitRequest(event)"><div class="formgrid"><div class="field"><label>نوع درخواست</label><select id="rtype" class="control">${reqTypes.map(x=>`<option ${x===pre?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>عنوان</label><input id="rtitle" class="control" value="درخواست ${pre}" required></div><div class="field full"><label>شرح</label><textarea id="rdesc" class="control" required placeholder="شرح دقیق درخواست، بازه، علت یا مستندات موردنیاز"></textarea></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">انصراف</button><button class="btn primary">ثبت درخواست</button></div></form>`)}
function submitRequest(e){e.preventDefault();let id='REQ-'+(1043+db.requests.length);db.requests.unshift({id,type:document.getElementById('rtype').value,title:document.getElementById('rtitle').value,uid:user().id,date:'۱۴۰۵/۰۷/۰۳',stage:'تأیید مدیر',status:'در انتظار تأیید'});db.activity.unshift(['ثبت درخواست',id,'همین الان']);save();closeModal();render();toast('درخواست '+id+' ثبت شد')}
function decide(id,status){let r=db.requests.find(x=>x.id===id);if(!r)return;r.status=status;r.stage='پایان فرآیند';save();render();toast(id+' '+status)}
function details(id){let r=db.requests.find(x=>x.id===id),p=users.find(x=>x.id===r.uid);openModal('جزئیات '+id,`<div class="cards" style="grid-template-columns:repeat(2,1fr)"><div class="card stat"><small>عنوان</small><strong style="font-size:15px">${esc(r.title)}</strong></div><div class="card stat"><small>ثبت‌کننده</small><strong style="font-size:15px">${esc(p?.name||'')}</strong></div><div class="card stat"><small>وضعیت</small>${badge(r.status)}</div><div class="card stat"><small>مرحله</small><strong style="font-size:15px">${esc(r.stage)}</strong></div></div><div class="panel" style="margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:13px"><div class="timeline"><div class="step"><div class="dot">۱</div><div><strong>ثبت درخواست</strong><p>درخواست در سامانه ثبت شد.</p></div><time>${r.date}</time></div><div class="step"><div class="dot">۲</div><div><strong>بررسی و تأیید</strong><p>${esc(r.stage)}</p></div><time>${r.status==='در انتظار تأیید'?'در انتظار':'انجام شد'}</time></div><div class="step"><div class="dot">۳</div><div><strong>پایان فرآیند</strong><p>پس از تکمیل تصمیم و اقدام نهایی.</p></div><time>${r.status==='در انتظار تأیید'?'—':'انجام شد'}</time></div></div></div><div class="modal-actions">${manager()&&r.status==='در انتظار تأیید'?`<button class="btn success" onclick="closeModal();decide('${id}','تأیید شده')">تأیید</button><button class="btn danger" onclick="closeModal();decide('${id}','رد شده')">رد</button>`:''}<button class="btn secondary" onclick="closeModal()">بستن</button></div>`)}
function processDetails(i){let p=processes[i];openModal(p[0],`<p class="muted" style="font-size:10px">مالک فرآیند: ${esc(p[2])}</p><div class="timeline">${p[1].split(' → ').map((x,j)=>`<div class="step"><div class="dot">${j+1}</div><div><strong>${esc(x)}</strong><p>مرحله نمونه گردش کار؛ کنترل واقعی در نسخه متصل باید از موتور فرآیند دریافت شود.</p></div><time>${j===0?'ثبت':'گام '+(j+1)}</time></div>`).join('')}</div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">بستن</button></div>`)}
function render(){theme();document.getElementById('root').innerHTML=session&&user()?shell():loginView();document.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{let h=td.closest('table').querySelectorAll('thead th')[i];if(h)td.dataset.label=h.textContent.trim()}))}
render();
</script>
</body>
</html>
